name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:

# 동시 push 시 이전 실행 취소 (리소스 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (build · test · clippy · fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'core/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Release build
        run: cargo build --release

      - name: Upload bathos binary
        uses: actions/upload-artifact@v4
        with:
          name: bathos-${{ runner.os }}
          path: core/target/release/bathos
          if-no-files-found: error

  hooks:
    name: Safety hooks (determinism harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build engine (hooks call the bathos binary)
        working-directory: core
        run: cargo build --release

      - name: Run hook determinism harness
        env:
          BATHOS_BIN: ${{ github.workspace }}/core/target/release/bathos
        run: bash .claude/hooks/_test-hooks.sh
