[workspace]
resolver = "2"
members = [
    "crates/bathos-state",
    "crates/bathos-router",
    "crates/bathos-wave-engine",
    "crates/bathos-gate-engine",
    "crates/bathos-story-engine",
    "crates/bathos-story-compiler",
    "crates/bathos-plug",
    "crates/bathos-cli",
    "crates/bathos-inspect",
]

# ── 공유 의존 버전 (workspace 레벨 고정) ───────────────────────────────────
[workspace.dependencies]
serde        = { version = "1",  features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
sha2         = "0.10"
thiserror    = "1"
anyhow       = "1"
fs4          = "1"
tempfile     = "3"
clap         = { version = "4", features = ["derive"] }
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
jsonschema   = { version = "0.18", default-features = false }
hex          = "0.4"
# 크로스플랫폼 OS CSPRNG (unix=/dev/urandom, Windows=BCryptGenRandom, macOS=getentropy).
# 감사 키 생성이 Windows에서도 동작하도록 직접 의존성으로 승격(원래 uuid v4 경유 트랜지티브).
getrandom    = "0.2"
