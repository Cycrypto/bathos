<title>BATHOS 강의 시리즈 — Lectures</title>
<style>

  :root{
    --abyss:#081215; --abyss-2:#0b1a1e; --surface:#0f2226; --surface-2:#12292e;
    --line:#1c3a40; --teal:#18b6c0; --teal-brand:#0e9aa1; --teal-soft:#7fd6dc;
    --ink:#e9f3f4; --muted:#8fabb0; --dim:#5f7c81;
    --amber:#e0ad55; --rose:#e5738a; --grn:#4fbf9a;
    --mono:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1100px 620px at 78% -8%, rgba(14,154,161,.20), transparent 60%),
      radial-gradient(900px 560px at 8% 108%, rgba(14,154,161,.12), transparent 60%),
      var(--abyss);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* top bar */
  header{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:linear-gradient(180deg, rgba(8,18,21,.92), rgba(8,18,21,.55) 70%, transparent);
    backdrop-filter:blur(4px);
  }
  .wordmark{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:.06em}
  .wordmark b{color:var(--teal);text-shadow:0 0 18px rgba(24,182,192,.5)}
  .wordmark .gr{font-family:var(--mono);color:var(--dim);font-weight:600;font-size:.78rem;letter-spacing:.02em}
  .spacer{flex:1}
  .counter{font-family:var(--mono);color:var(--muted);font-size:.82rem;letter-spacing:.05em}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(15,34,38,.6)}
  .toggle button{
    all:unset;cursor:pointer;padding:6px 13px;font-size:.78rem;font-weight:700;color:var(--muted);
    letter-spacing:.04em;transition:.15s;
  }
  .toggle button.on{background:var(--teal-brand);color:#04181a;text-shadow:none}
  .toggle button:not(.on):hover{color:var(--teal-soft)}
  .series{display:flex;gap:6px;align-items:center}
  .series a{font-family:var(--mono);font-size:.74rem;letter-spacing:.03em;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;transition:.15s;white-space:nowrap}
  .series a:hover{color:var(--teal-soft);border-color:var(--teal)}
  .series a.cur{background:var(--surface-2);color:var(--teal-soft);border-color:var(--teal)}
  .series .en{display:none}
  body.en .series .en{display:inline} body.en .series .kr{display:none}
  @media (max-width:820px){ .series{display:none} }
  /* stage */
  .stage{position:fixed;inset:56px 0 64px;display:flex;align-items:center;justify-content:center;padding:22px}
  .deck{width:min(1000px,100%);height:100%;position:relative}
  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:20px 8px;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .34s ease, transform .34s ease;overflow-y:auto;
  }
  .slide.active{opacity:1;transform:none;pointer-events:auto}
  .kicker{font-family:var(--mono);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
  h1{font-size:clamp(2.1rem,5.4vw,3.7rem);line-height:1.06;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
  h1 .gr{display:block;font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--teal-soft);letter-spacing:.04em;margin-top:14px}
  h2{font-size:clamp(1.5rem,3.4vw,2.35rem);line-height:1.14;margin:0 0 20px;font-weight:800;letter-spacing:-.01em}
  h2 .n{color:var(--teal);font-family:var(--mono);font-weight:700;margin-right:.5em}
  .lead{font-size:clamp(1.02rem,1.7vw,1.22rem);color:var(--muted);line-height:1.6;max-width:60ch}
  .sub{font-size:clamp(1rem,1.9vw,1.28rem);color:var(--muted);max-width:62ch;line-height:1.55}
  ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:11px}
  li{position:relative;padding-left:26px;font-size:clamp(.98rem,1.5vw,1.12rem);line-height:1.5;color:var(--ink)}
  li::before{content:"▸";position:absolute;left:2px;top:0;color:var(--teal);font-size:.95em}
  li b{color:#fff}
  li .k{color:var(--teal-soft);font-weight:700}
  code,.cmd,.mono{font-family:var(--mono)}
  code{background:rgba(24,182,192,.12);color:var(--teal-soft);padding:.08em .42em;border-radius:5px;font-size:.9em}
  .cmd{
    display:block;background:#061012;border:1px solid var(--line);border-left:3px solid var(--teal-brand);
    border-radius:9px;padding:15px 17px;margin-top:10px;color:#cfe9ec;font-size:clamp(.8rem,1.25vw,.98rem);
    line-height:1.75;white-space:pre;overflow-x:auto;
  }
  .cmd .c{color:var(--dim)}
  .cmd .p{color:var(--teal)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:clamp(.85rem,1.3vw,1.02rem)}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--teal);font-family:var(--mono);font-weight:700;font-size:.82em;letter-spacing:.05em;text-transform:uppercase}
  td b{color:#fff}
  .tag{font-family:var(--mono);font-size:.86em;padding:.1em .5em;border-radius:5px;border:1px solid var(--line)}
  .pass{color:var(--grn);border-color:rgba(79,191,154,.4)}
  .concern{color:var(--amber);border-color:rgba(224,173,85,.4)}
  .fail{color:var(--rose);border-color:rgba(229,115,138,.4)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{margin:0 0 10px;font-size:1.02rem;color:var(--teal-soft);font-family:var(--mono);letter-spacing:.03em}
  .note{
    margin-top:16px;padding:13px 16px;border-radius:10px;background:rgba(224,173,85,.09);
    border:1px solid rgba(224,173,85,.32);color:#f0dcb4;font-size:.96rem;line-height:1.55;
  }
  .note.teal{background:rgba(24,182,192,.09);border-color:rgba(24,182,192,.32);color:var(--teal-soft)}
  .note b{color:#fff}
  .pill{display:inline-block;font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;color:var(--teal);
    border:1px solid var(--line);border-radius:999px;padding:3px 11px;margin:0 6px 8px 0}
  .hint{margin-top:26px;font-family:var(--mono);color:var(--dim);font-size:.82rem;letter-spacing:.05em}
  .muted{color:var(--muted)} .small{font-size:.9rem}
  /* footer / nav */
  footer{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 22px;
    background:linear-gradient(0deg, rgba(8,18,21,.94), rgba(8,18,21,.4) 70%, transparent)}
  .progress{position:absolute;top:0;left:0;height:2px;background:var(--teal);box-shadow:0 0 10px var(--teal);transition:width .34s ease}
  .dots{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:#1e3d43;border:none;cursor:pointer;padding:0;transition:.2s}
  .dot:hover{background:var(--teal-soft)}
  .dot.on{background:var(--teal);box-shadow:0 0 8px var(--teal);transform:scale(1.15)}
  .nav{display:flex;gap:8px}
  .nav button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:9px;
    border:1px solid var(--line);background:rgba(15,34,38,.6);color:var(--teal-soft);font-size:1.1rem;transition:.15s}
  .nav button:hover{border-color:var(--teal);background:rgba(24,182,192,.14)}
  .nav button:disabled{opacity:.3;cursor:default}
  @media (max-width:640px){
    .grid2{grid-template-columns:1fr} .stage{inset:52px 0 60px;padding:14px}
    header{height:52px;padding:0 14px} footer{padding:0 14px} .dots{display:none}
    .wordmark .gr{display:none}
  }
  @media print{
    body{overflow:visible;background:#fff;color:#111}
    header,footer{display:none} .stage{position:static;inset:auto;display:block}
    .deck{width:100%;height:auto} .slide{position:static;opacity:1;transform:none;page-break-after:always;
      min-height:90vh;border-bottom:1px solid #ccc}
  }

  .series button{all:unset;cursor:pointer;font-family:var(--mono);font-size:.74rem;letter-spacing:.03em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;transition:.15s;white-space:nowrap}
  .series button:hover{color:var(--teal-soft);border-color:var(--teal)}
  .series button.cur{background:var(--surface-2);color:var(--teal-soft);border-color:var(--teal)}

</style>

<header>
  <div class="wordmark"><span><b>BATHOS</b></span><span class="gr">βάθος</span></div>
  <nav class="series" id="seriesnav" aria-label="lecture series">
    <button data-s="usecase"><span class="kr">① 사례</span><span class="en">① Use case</span></button>
    <button data-s="features"><span class="kr">② 원리</span><span class="en">② Features</span></button>
    <button data-s="usage"><span class="kr">③ 사용</span><span class="en">③ Usage</span></button>
  </nav>
  <div class="spacer"></div>
  <div class="counter"><span id="cur">1</span> / <span id="tot">1</span></div>
  <div class="toggle" role="group" aria-label="language">
    <button id="ko" class="on" onclick="setLang('ko')">한국어</button>
    <button id="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<div class="stage"><div class="deck" id="deck"></div></div>

<footer>
  <div class="progress" id="bar"></div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button id="prev" onclick="go(idx-1)" aria-label="prev">◀</button>
    <button id="next" onclick="go(idx+1)" aria-label="next">▶</button>
  </div>
</footer>

<script>
const DECKS = {
  usecase: [
{
ko:`<div class="kicker">활용 사례 · 시리즈 ①</div>
<h1>새 서비스를 처음부터<span class="gr">ReadShelf — 독서 기록·리뷰 공유 웹앱을 예시로</span></h1>
<p class="sub">BATHOS로 <b>실제 새 서비스를 처음부터</b> 만드는 과정을, 하나의 구체적 예시로 끝까지 따라간다. 무엇을 입력하고, 각 단계에서 무엇이 일어나며, 디스크에 어떤 파일이 생기는지.</p>
<div class="hint">← / → 또는 Space 로 이동 · 우상단에서 언어 전환</div>`,
en:`<div class="kicker">Use case · series ①</div>
<h1>A new service from scratch<span class="gr">ReadShelf — a book-logging &amp; review-sharing web app</span></h1>
<p class="sub">Follow one concrete example end to end while building <b>an actual new service from scratch</b> with BATHOS: what you type, what happens at each step, and which files land on disk.</p>
<div class="hint">Move with ← / → or Space · switch language top-right</div>`
},
{
ko:`<h2><span class="n">0</span>30초 멘탈 모델</h2>
<p class="lead">BATHOS는 <b>실행하는 앱이 아니다</b> — Claude Code 위에서 도는 메서드 패키지다. 당신이 하는 일은 셋뿐.</p>
<ul>
<li><b>내 프로젝트에 설치</b> — <code>.claude/</code>+<code>assets/</code>+<code>modules/</code> 복사, 엔진 경로 환경변수</li>
<li><b>Claude Code를 열고 슬래시 커맨드 입력</b> — <code>/team-kickoff</code>, <code>/route</code>, <code>/wave1-discovery</code>…</li>
<li>웨이브 단위로 팀원이 뜨고, 산출물은 <code>.agent-team/</code>에, <b>실제 코드는 <code>src/</code></b>에 쌓인다</li>
</ul>
<div class="note teal">이게 전부다. 나머지는 이 셋을 실제 예시로 천천히 해보는 것뿐.</div>`,
en:`<h2><span class="n">0</span>The 30-second mental model</h2>
<p class="lead">BATHOS is <b>not an app you run</b> — it's a method package on Claude Code. You do just three things.</p>
<ul>
<li><b>Install it into your project</b> — copy <code>.claude/</code>+<code>assets/</code>+<code>modules/</code>, set an env var for the engine</li>
<li><b>Open Claude Code &amp; type slash commands</b> — <code>/team-kickoff</code>, <code>/route</code>, <code>/wave1-discovery</code>…</li>
<li>Teammates spin up wave by wave; outputs go to <code>.agent-team/</code>, <b>real code to <code>src/</code></b></li>
</ul>
<div class="note teal">That's it. The rest is just walking those three slowly through a real example.</div>`
},
{
ko:`<h2><span class="n">예시</span>ReadShelf</h2>
<table>
<tr><th>항목</th><th>내용</th></tr>
<tr><td><b>무엇</b></td><td>읽은 책 기록 → 짧은 리뷰 → 친구 팔로우 → 친구 독서 피드</td></tr>
<tr><td><b>누가</b></td><td>1인 개발자(당신)</td></tr>
<tr><td><b>스택(계획)</b></td><td>Next.js · Node/Express API · PostgreSQL. MVP엔 AI/ML 없음</td></tr>
<tr><td><b>포부</b></td><td>거대 플랫폼이 아니라 우선 <b>집중된 MVP</b></td></tr>
</table>
<div class="note">기억해 두자: ReadShelf는 <b>새롭지만 집중된</b> 제품. 이 선택이 3단계 "레벨"을 고를 때 중요해진다.</div>`,
en:`<h2><span class="n">Example</span>ReadShelf</h2>
<table>
<tr><th>Item</th><th>Detail</th></tr>
<tr><td><b>What</b></td><td>log books → short reviews → follow friends → friends' reading feed</td></tr>
<tr><td><b>Who</b></td><td>a solo developer (you)</td></tr>
<tr><td><b>Stack (planned)</b></td><td>Next.js · Node/Express API · PostgreSQL. No AI/ML in the MVP</td></tr>
<tr><td><b>Ambition</b></td><td>not a giant platform — a <b>focused MVP</b> first</td></tr>
</table>
<div class="note">Keep in mind: ReadShelf is a <b>new but focused</b> product. That choice matters when picking a "level" in step 3.</div>`
},
{
ko:`<h2><span class="n">1</span>설치 (B 방식 — 내 프로젝트에 채택)</h2>
<div class="cmd"><span class="c"># 새 프로젝트 위치</span>
mkdir -p ~/projects/readshelf
<span class="c"># BATHOS 패키지에서 실행</span>
cd ~/tools/bathos
./install.sh <span class="p">--into</span> ~/projects/readshelf</div>
<ul style="margin-top:12px">
<li>엔진 1회 빌드 + <code>.claude/</code>·<code>assets/</code>·<code>modules/</code> 3폴더 복사</li>
<li><b>아무것도 삭제하지 않음</b> · 바이너리는 복사하지 않고 <b>가리키기만</b></li>
</ul>
<div class="cmd">export BATHOS_BIN="$HOME/tools/bathos/core/target/release/bathos"
export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</div>`,
en:`<h2><span class="n">1</span>Install (style B — adopt into my project)</h2>
<div class="cmd"><span class="c"># where the new project lives</span>
mkdir -p ~/projects/readshelf
<span class="c"># run from the BATHOS package</span>
cd ~/tools/bathos
./install.sh <span class="p">--into</span> ~/projects/readshelf</div>
<ul style="margin-top:12px">
<li>Builds the engine once + copies 3 folders <code>.claude/</code>·<code>assets/</code>·<code>modules/</code></li>
<li><b>Deletes nothing</b> · doesn't copy the binary — your project just <b>points at it</b></li>
</ul>
<div class="cmd">export BATHOS_BIN="$HOME/tools/bathos/core/target/release/bathos"
export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</div>`
},
{
ko:`<h2><span class="n">2</span>킥오프 — <code>/team-kickoff</code></h2>
<p class="lead">내 프로젝트에서 Claude Code 세션을 연다. 이 세션이 <b>리드 "Paul"</b>. 작업 영역과 단일 진실 원천이 생긴다.</p>
<div class="cmd">~/projects/readshelf/
├── .claude/  assets/  modules/   <span class="c">(설치본)</span>
└── .agent-team/                  <span class="c">← 신규</span>
    ├── 00-plan/  01-reverse/ … 12-report/
    └── _state/manifest.json      <span class="c">← SSOT (스키마 검증)</span></div>
<div class="note teal">두 디렉터리, 두 목적. <code>.agent-team/</code>=작업 노트, <code>src/</code>=실제 서비스 코드. 섞이지 않는다.</div>`,
en:`<h2><span class="n">2</span>Kickoff — <code>/team-kickoff</code></h2>
<p class="lead">Open a Claude Code session in your project. That session is <b>the lead, "Paul."</b> It creates the workspace and the single source of truth.</p>
<div class="cmd">~/projects/readshelf/
├── .claude/  assets/  modules/   <span class="c">(the install)</span>
└── .agent-team/                  <span class="c">← new</span>
    ├── 00-plan/  01-reverse/ … 12-report/
    └── _state/manifest.json      <span class="c">← SSOT (schema-validated)</span></div>
<div class="note teal">Two directories, two purposes. <code>.agent-team/</code> = work notes, <code>src/</code> = real service code. They never mix.</div>`
},
{
ko:`<h2><span class="n">3</span><code>/route</code> — 레벨 정하기 (당신이 결정)</h2>
<p class="lead">엔진이 네 축에 점수를 매겨 레벨을 추천한다.</p>
<table>
<tr><th>축</th><th>ReadShelf</th><th>점수</th></tr>
<tr><td><code>scope</code></td><td>feature (집중 MVP)</td><td>1</td></tr>
<tr><td><code>novelty</code></td><td>true (새 아이디어)</td><td>+1</td></tr>
<tr><td><code>regulation_ip</code></td><td>false</td><td>+0</td></tr>
<tr><td><code>team_size</code></td><td>solo</td><td>+0</td></tr>
</table>
<div class="note teal">합계 <b>2 → 추천 Lv2</b>. BATHOS는 추천만 — <code>--confirm 2</code>로 <b>당신이 확정</b>해야 기록된다(User Sovereignty). 이후 W1→W2→W3→W5→W6.</div>`,
en:`<h2><span class="n">3</span><code>/route</code> — pick a level (you decide)</h2>
<p class="lead">The engine scores four axes to recommend a level.</p>
<table>
<tr><th>Axis</th><th>ReadShelf</th><th>Score</th></tr>
<tr><td><code>scope</code></td><td>feature (focused MVP)</td><td>1</td></tr>
<tr><td><code>novelty</code></td><td>true (new idea)</td><td>+1</td></tr>
<tr><td><code>regulation_ip</code></td><td>false</td><td>+0</td></tr>
<tr><td><code>team_size</code></td><td>solo</td><td>+0</td></tr>
</table>
<div class="note teal">Total <b>2 → recommended Lv2</b>. BATHOS only recommends — <b>you confirm</b> with <code>--confirm 2</code> before it's recorded (User Sovereignty). Then W1→W2→W3→W5→W6.</div>`
},
{
ko:`<h2><span class="n">4</span>W1 — 디스커버리 &amp; 시장</h2>
<p class="lead"><code>/wave1-discovery /abs/path</code> — 무엇을 만들까?</p>
<ul>
<li><b>Caleb</b>(시장 분석가)가 주역 — 유사 독서/소셜 앱 조사, 빈틈 발견, <b>USP</b> 제안</li>
<li><b>John</b>(리버스)은 참조 코드베이스를 줄 때만 의미 — 그린필드면 생략 가능</li>
<li>산출: <code>.agent-team/02-market-analysis/</code> — 경쟁 지형·USP 추천</li>
</ul>
<div class="note"><b>게이트: USP Readiness.</b> 다음으로 넘어가기 전 USP가 말이 되는지 당신(리드)이 확인. 웨이브 끝에 팀원 shutdown, 동시 ≤3으로 토큰 절약.</div>`,
en:`<h2><span class="n">4</span>W1 — discovery &amp; market</h2>
<p class="lead"><code>/wave1-discovery /abs/path</code> — what should we build?</p>
<ul>
<li><b>Caleb</b> (market analyst) leads — researches similar reading/social apps, finds gaps, proposes a <b>USP</b></li>
<li><b>John</b> (reverse) only helps with a reference codebase — skip for greenfield</li>
<li>Output: <code>.agent-team/02-market-analysis/</code> — competitive landscape · USP recommendation</li>
</ul>
<div class="note"><b>Gate: USP Readiness.</b> You (the lead) confirm the USP makes sense before moving on. Teammates shut down at wave end; ≤3 concurrent saves tokens.</div>`
},
{
ko:`<h2><span class="n">5</span>W2 — 기획 · 아키텍처 · 디자인</h2>
<p class="lead"><code>/wave2-design /abs/path</code> — 의도된 순서로 돈다.</p>
<ul>
<li><b>Joshua</b>(기획)가 USP를 Core Feature + User Story + Service Story로. <b>그의 산출물이 곧 게이트</b> — 단단해질 때까지 나머지는 대기</li>
<li>그 다음 병렬: <b>James</b>(ERD·API 계약·시퀀스·예외) ∥ <b>Jonnathan</b>(UX 흐름·UI)</li>
<li>산출: <code>03-service-planning/</code> · <code>04-architecture/</code> · <code>07-design/</code></li>
</ul>
<div class="note"><b>게이트: Plan Readiness.</b> 선택 강화: <code>/plan-ceo-review</code>(10점짜리 제품인가?)·<code>/plan-eng-review</code> — 한 번에 한 리뷰어.</div>`,
en:`<h2><span class="n">5</span>W2 — planning · architecture · design</h2>
<p class="lead"><code>/wave2-design /abs/path</code> — runs in a deliberate order.</p>
<ul>
<li><b>Joshua</b> (planning) turns the USP into Core Features + User Stories + a Service Story. <b>His output is the gate</b> — nothing else starts until it's solid</li>
<li>Then in parallel: <b>James</b> (ERD·API contracts·sequences·exceptions) ∥ <b>Jonnathan</b> (UX flows·UI)</li>
<li>Output: <code>03-service-planning/</code> · <code>04-architecture/</code> · <code>07-design/</code></li>
</ul>
<div class="note"><b>Gate: Plan Readiness.</b> Optional: <code>/plan-ceo-review</code> (is this a 10/10 product?) · <code>/plan-eng-review</code> — one reviewer at a time.</div>`
},
{
ko:`<h2><span class="n">6 ★</span>W3 — 스토리 게이트 (심장)</h2>
<p class="lead">대부분의 "AI가 앱 만들어줘"가 무너지는 지점 = <b>설계 → 구현</b>. W3가 이 틈을 닫는다.</p>
<ul>
<li><b>Matthew(#17)</b>가 W2 설계를 <b>자족 dev 스토리파일</b>로 응축 (예: <code>story-1-2-write-review-kr.md</code>)</li>
<li>6개 필수 섹션 + 모든 기술 주장에 <code>[Source: …]</code> — 누락 시 <code>E-CTX-LOSS</code> 컴파일 실패</li>
<li><b>Thomas · Matthias</b> 독립 리뷰 → <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note"><b>FAIL이면</b> <code>gate-enforce</code> 훅이 W5 시작을 <b>물리 차단</b>(exit 2). "생성 ≠ 검증"의 물리적 구현 — 같은 모델이 자기 작업을 슬쩍 통과시킬 수 없다.</div>`,
en:`<h2><span class="n">6 ★</span>W3 — the story gate (the heart)</h2>
<p class="lead">Where most "AI, build my app" attempts collapse = <b>design → implementation</b>. W3 closes that gap.</p>
<ul>
<li><b>Matthew(#17)</b> condenses the W2 design into <b>self-contained dev story files</b> (e.g. <code>story-1-2-write-review-en.md</code>)</li>
<li>6 required sections + <code>[Source: …]</code> on every technical claim — a missing one fails with <code>E-CTX-LOSS</code></li>
<li><b>Thomas · Matthias</b> review independently → <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note">On <b>FAIL</b>, the <code>gate-enforce</code> hook <b>physically blocks</b> W5 (exit 2). The physical form of "generation ≠ verification" — no model waves its own work through.</div>`
},
{
ko:`<h2><span class="n">7</span>W5 — 구현 (실제 코드)</h2>
<p class="lead"><code>/wave5-implement /abs/path</code> — ReadShelf에 필요한 역할만.</p>
<ul>

<li><b>Andrew</b>(프론트) — Jonnathan 디자인 기반 Next.js UI를 James API 계약에 연결</li>
<li><b>Stephen</b>(ML)은 <b>스폰 안 함</b> — MVP에 ML 없음</li>
</ul>
<div class="cmd">~/projects/readshelf/
├── src/  api/  web/ …            <span class="c">← 실제 코드가 스토리 단위로</span>
└── .agent-team/08-impl-notes/    <span class="c">← backend.md, frontend.md</span></div>
<div class="note teal">각 팀원은 <b>자기 소유 경로만</b> 편집 → 충돌 0. <code>careful-guard</code>·<code>freeze-guard</code>가 내내 활성.</div>`,
en:`<h2><span class="n">7</span>W5 — implementation (real code)</h2>

└── .agent-team/08-impl-notes/    <span class="c">← backend.md, frontend.md</span></div>
<div class="note teal">Each teammate edits <b>only their owned paths</b> → zero collisions. <code>careful-guard</code>·<code>freeze-guard</code> stay active throughout.</div>`
},

ko:`<h2><span class="n">8</span>W6 — 검증 · 문서 · 리포트</h2>

<li>그 다음 <b>Martin</b>이 단일 <b>HTML 리포트</b>로 취합</li>

en:`<h2><span class="n">8</span>W6 — verification · docs · report</h2>

  features: [
{
ko:`<div class="kicker">특징 &amp; 구동원리 · 시리즈 ②</div>
<h1>무엇이고, 어떻게 도는가<span class="gr">βάθος — 표층 AI 보조와 의도적으로 대비되는 깊이</span></h1>
<p class="sub"><b>BATHOS가 무엇이고(특징), 내부에서 실제로 어떻게 동작하는지(구동원리)</b>를 푼다. 전부 실제 v0.1.0 빌드 기준 — 구현·검증된 것만, 한계는 감추지 않는다.</p>
<div class="hint">← / → 또는 Space 로 이동 · 우상단에서 언어 전환</div>`,
en:`<div class="kicker">Features &amp; mechanics · series ②</div>
<h1>What it is, and how it runs<span class="gr">βάθος — depth, deliberately against surface-level AI</span></h1>
<p class="sub">Unpacks <b>what BATHOS is (features) and how it actually works inside (mechanics)</b>. All against the real v0.1.0 build — only what's implemented and verified; limits aren't hidden.</p>
<div class="hint">Move with ← / → or Space · switch language top-right</div>`
},
{
ko:`<h2><span class="n">0</span>모든 것의 바탕이 되는 한 생각</h2>
<p class="lead">긴 단일 LLM 대화는 <b>표류(drift)</b>한다 — "설계"와 "구현" 사이 컨텍스트가 새고, 품질 점검은 생략되며, <b>같은 모델</b>이 쓰고 또 스스로 승인한다.</p>
<div class="note teal" style="font-size:1.15rem"><b>생성 ≠ 검증.</b> 생성자는 자기 산출물의 사각(blind spot)을 보지 못한다.</div>
<p class="lead" style="margin-top:16px">그래서 BATHOS는 표류하는 한 대화를 <b>구조</b>로 대체한다: 분리된 전문 역할 · 단계화된 파이프라인 · <b>독립</b> 검증자 · 핵심 불변식을 <b>코드로 강제</b>하는 결정적 엔진.</p>`,
en:`<h2><span class="n">0</span>The one idea underneath everything</h2>
<p class="lead">A long single LLM conversation <b>drifts</b> — context leaks between "design" and "implementation," quality checks get skipped, and <b>the same model</b> both writes and approves the work.</p>
<div class="note teal" style="font-size:1.15rem"><b>Generation ≠ verification.</b> A generator cannot see the blind spots in its own output.</div>
<p class="lead" style="margin-top:16px">So BATHOS replaces one drifting conversation with <b>structure</b>: separated specialist roles · a staged pipeline · <b>independent</b> verifiers · a deterministic engine that enforces the key invariants <b>in code</b>.</p>`
},
{
ko:`<h2><span class="n">0 ✦</span>비유가 아니다 — 스스로 증명했다</h2>
<p class="lead">BATHOS는 자기 자신을 구현한 뒤, 자기 코드에 Wave 6 독립 검증을 그대로 돌렸다.</p>
<ul>
<li>기능 QA는 <b>그린</b>이었다</li>
<li>그런데 <b>독립 코드 리뷰가 저자가 놓친 차단성 불변식 결함</b>을 잡았다 — Rust 엔진과 bash 훅이 같은 감사 체인에 <b>비호환 형식</b>으로 기록 → tamper-evidence가 조용히 무력화</li>
<li>보완 · 재게이트 · 백로그 소진 → 전건 해소</li>
</ul>
<div class="note">명제의 실증: 같은 모델이 쓰고 스스로 승인하면 <b>반드시 사각이 남는다.</b></div>`,
en:`<h2><span class="n">0 ✦</span>Not a metaphor — it proved itself</h2>
<p class="lead">BATHOS implemented itself, then ran Wave 6 independent verification on its own code.</p>
<ul>
<li>Functional QA was <b>green</b></li>
<li>Yet the <b>independent code review caught a blocking invariant defect the author had missed</b> — the Rust engine and bash hooks wrote to the same audit chain in <b>incompatible formats</b> → tamper-evidence silently neutralized</li>
<li>Fixed · re-gated · backlog burned down → fully resolved</li>
</ul>
<div class="note">Demonstration of the thesis: when one model writes and self-approves, <b>blind spots always remain.</b></div>`
},
{
ko:`<h2><span class="n">1</span>차별화하는 12가지 특징 <span class="muted small">(1–6)</span></h2>
<ul>
<li><b>17 역할 × 7 웨이브</b> — 한 대화가 아니라 절제된 제품 팀처럼</li>
<li><b>두 실행면</b> — 편집 가능한 마크다운 + 결정적 Rust 엔진</li>
<li><b>Scale-Adaptive (Lv0~4)</b> — 필요한 웨이브만</li>
<li><b>Zero-Context-Loss 스토리파일 (W3)</b> — 설계→구현 갭 차단</li>
<li><b>하드 게이트</b> — FAIL은 훅(exit 2)으로 진입 물리 차단</li>
<li><b>독립 검증 + 감사 체인</b> — 저자와 검증자 분리, append-only sha256</li>
</ul>`,
en:`<h2><span class="n">1</span>Twelve distinguishing features <span class="muted small">(1–6)</span></h2>
<ul>
<li><b>17 roles × 7 waves</b> — a disciplined product team, not one conversation</li>
<li><b>Two execution planes</b> — editable markdown + a deterministic Rust engine</li>
<li><b>Scale-Adaptive (Lv0–4)</b> — only the waves the work needs</li>
<li><b>Zero-context-loss story files (W3)</b> — closes the design→build gap</li>
<li><b>Hard gates</b> — a FAIL physically blocks entry via a hook (exit 2)</li>
<li><b>Independent verification + audit chain</b> — author/verifier split, append-only sha256</li>
</ul>`
},
{
ko:`<h2><span class="n">1</span>차별화하는 12가지 특징 <span class="muted small">(7–12)</span></h2>
<ul>
<li><b>User Sovereignty</b> — AI는 제안, 사용자가 결정. 방향 변경은 "추천+근거+놓친 맥락"</li>
<li><b>안전 훅 (careful/freeze)</b> — 파괴적 명령 차단, 소유 경로 잠금 (fail-safe)</li>
<li><b>플러그 모듈</b> — 슬림 코어, 도메인 opt-in, 코어는 모듈을 모름</li>
<li><b>3계층 역할 오버라이드</b> — base 고정, team/user가 포크 없이 덮어씀</li>
<li><b>한 단어 세션 저장/재개</b> — <code>/save</code>·<code>/resume</code>, 자연어도</li>
<li><b>크로스-프로젝트 메모리</b> — 새 프로젝트도 이전 결정·패턴으로 warm-start</li>
</ul>`,
en:`<h2><span class="n">1</span>Twelve distinguishing features <span class="muted small">(7–12)</span></h2>
<ul>
<li><b>User Sovereignty</b> — AI proposes, the user decides. Direction changes as "rec + rationale + missed context"</li>
<li><b>Safety hooks (careful/freeze)</b> — block destructive commands, lock owned paths (fail-safe)</li>
<li><b>Plug modules</b> — slim core, opt-in domains, the core doesn't know modules exist</li>
<li><b>3-layer role overrides</b> — base pinned; team/user override without forking</li>
<li><b>One-word session save/resume</b> — <code>/save</code>·<code>/resume</code>, natural language too</li>
<li><b>Cross-project memory</b> — new projects warm-start from earlier decisions/patterns</li>
</ul>`
},
{
ko:`<h2><span class="n">2.1</span>두 실행면</h2>
<table>
<tr><th>면</th><th>정체</th><th>책임</th></tr>
<tr><td><b>오케스트레이션</b></td><td>마크다운 커맨드·역할·훅 (<code>.claude/</code>)</td><td>웨이브 진행, 팀원 스폰/검수/종료</td></tr>
<tr><td><b>엔진</b></td><td><code>bathos</code> 단일 정적 바이너리(~5.6MB, 7크레이트)</td><td>상태·라우팅·게이트·스토리·플러그·감사 <b>계산·강제</b></td></tr>
</table>
<div class="note teal">분리가 핵심: <b>신뢰·재현 가능해야 하는 것</b>(게이트가 정말 통과했나? 활성 역할 ≤3? 감사체인 무결?)은 엔진에 두어 단위 테스트로 보장 → 설득력 있는 모델도 "말로 우회" 불가.</div>`,
en:`<h2><span class="n">2.1</span>The two execution planes</h2>
<table>
<tr><th>Plane</th><th>What</th><th>Responsibility</th></tr>
<tr><td><b>Orchestration</b></td><td>markdown commands·roles·hooks (<code>.claude/</code>)</td><td>advance waves, spawn/inspect/shut down teammates</td></tr>
<tr><td><b>Engine</b></td><td><code>bathos</code> single static binary (~5.6MB, 7 crates)</td><td><b>computes &amp; enforces</b> state·routing·gates·stories·plugs·audit</td></tr>
</table>
<div class="note teal">The split is the point: <b>whatever must be trusted and reproducible</b> (did the gate pass? roles ≤3? audit intact?) lives in the engine, unit-tested → no model can "talk its way around" it.</div>`
},
{
ko:`<h2><span class="n">2.2</span>상태 모델 — 단일 진실 원천</h2>
<p class="lead">전 프로젝트 상태가 단일 JSON <code>manifest.json</code>에 인라인 + JSON Schema 검증. 신뢰를 떠받치는 두 불변식:</p>
<ul>
<li><b>원자적 쓰기</b> — manifest는 절반만 쓰인 채 남지 않는다</li>
<li><b>tamper-evident 감사 해시체인</b> — 모든 변경이 append-only sha256 체인에; <code>hash_prev[n]==hash_self[n-1]</code>, genesis 앵커, 단조 <code>seq</code></li>
<li><b>단일 writer</b>가 블로킹 파일락으로 직렬화 → 동시 append가 체인을 오염시킬 수 없다</li>
</ul>
<div class="note">단절=<code>E-AUDIT-TAMPER</code> · 스키마 위반=<code>E-STATE-CORRUPT</code>. <span class="muted small">(바로 dogfooding 리뷰가 잡아 단일화한 그 불변식.)</span></div>`,
en:`<h2><span class="n">2.2</span>State model — single source of truth</h2>
<p class="lead">All state inlined in one JSON <code>manifest.json</code> + JSON-Schema validated. Two invariants anchor the trust:</p>
<ul>
<li><b>Atomic writes</b> — the manifest is never left half-written</li>
<li><b>Tamper-evident audit hash chain</b> — every change appended to a sha256 chain; <code>hash_prev[n]==hash_self[n-1]</code>, genesis anchor, monotonic <code>seq</code></li>
<li>A <b>single writer</b> serializes behind a blocking file lock → concurrent appends can't corrupt the chain</li>
</ul>
<div class="note">Broken=<code>E-AUDIT-TAMPER</code> · schema violation=<code>E-STATE-CORRUPT</code>. <span class="muted small">(Exactly the invariant the dogfooding review caught and unified.)</span></div>`
},
{
ko:`<h2><span class="n">2.3</span>Scale-Adaptive 라우터 (결정적)</h2>
<p class="lead">네 "stakes" 축을 순수 산술로 레벨에 매핑 — 휴리스틱이 없으니 같은 입력이면 추천도 늘 같다.</p>
<table>
<tr><th>축</th><th>점수</th></tr>
<tr><td><code>scope</code> bug/feature/large/product</td><td>0 / 1 / 2 / 3</td></tr>
<tr><td><code>novelty</code></td><td>+1</td></tr>
<tr><td><code>regulation_ip</code></td><td>+2 <span class="muted small">(강한 상향)</span></td></tr>
<tr><td><code>team_size</code> solo/medium/large</td><td>0 / 1 / 2</td></tr>
</table>
<div class="note teal">합계 → <b>0:Lv0 · 1:Lv1 · 2–3:Lv2 · 4–5:Lv3 · 6+:Lv4</b>. <code>route decide</code>는 추천만, <code>--confirm</code>일 때만 기록(User Sovereignty). 이후 레벨 변경은 <code>E-LEVEL-DRIFT</code>로 재확인.</div>`,
en:`<h2><span class="n">2.3</span>Scale-Adaptive router (deterministic)</h2>
<p class="lead">Maps four "stakes" axes to a level by pure arithmetic — no heuristics, so the same input always yields the same recommendation.</p>
<table>
<tr><th>Axis</th><th>Score</th></tr>
<tr><td><code>scope</code> bug/feature/large/product</td><td>0 / 1 / 2 / 3</td></tr>
<tr><td><code>novelty</code></td><td>+1</td></tr>
<tr><td><code>regulation_ip</code></td><td>+2 <span class="muted small">(strong upward)</span></td></tr>
<tr><td><code>team_size</code> solo/medium/large</td><td>0 / 1 / 2</td></tr>
</table>
<div class="note teal">Total → <b>0:Lv0 · 1:Lv1 · 2–3:Lv2 · 4–5:Lv3 · 6+:Lv4</b>. <code>route decide</code> only recommends; records only on <code>--confirm</code> (User Sovereignty). Later level changes re-prompt via <code>E-LEVEL-DRIFT</code>.</div>`
},
{
ko:`<h2><span class="n">2.4</span>웨이브 엔진 — 상태 기계</h2>
<div class="cmd">(사전) 킥오프 → W0 → W1 → W2
        → W3 스토리 게이트 ★ → W5 → W6 → (사후) 확정
                          ↑
               W4 IP &amp; 연구 (선택 플러그)</div>
<ul style="margin-top:14px">
<li><b>동시성 ≤ 3</b> — <code>MAX_CONCURRENT_ROLES=3</code>, 4번째 스폰은 <code>E-CONCURRENCY</code>로 거부 (토큰 비용은 활성 팀원에 선형)</li>
<li><b>웨이브 종료 → 팀원 shutdown → 다음</b>. 인수인계는 전부 <code>.agent-team/</code> 디스크로 — 대화 히스토리 비의존</li>
</ul>`,
en:`<h2><span class="n">2.4</span>The wave engine — a state machine</h2>
<div class="cmd">(pre) kickoff → W0 → W1 → W2
        → W3 story gate ★ → W5 → W6 → (post) confirm
                          ↑
               W4 IP &amp; Research (optional plug)</div>
<ul style="margin-top:14px">
<li><b>Concurrency ≤ 3</b> — <code>MAX_CONCURRENT_ROLES=3</code>; a 4th spawn is rejected with <code>E-CONCURRENCY</code> (token cost is linear in active teammates)</li>
<li><b>Wave ends → teammates shut down → next</b>. Handoffs go entirely through <code>.agent-team/</code> disk — never conversation history</li>
</ul>`
},
{
ko:`<h2><span class="n">2.5 · 2.6</span>게이트 &amp; 스토리 엔진</h2>
<div class="grid2">
<div class="card"><h3>게이트</h3>
<p class="small"><span class="tag pass">PASS</span> 이슈 없음 · <span class="tag concern">CONCERNS</span> 비차단 · <span class="tag fail">FAIL</span> <code>critical&gt;0</code></p>
<p class="small muted" style="margin-top:8px">FACILITATOR이지 generator 아님 — <code>facilitator</code>는 비어 있을 수 없다. 근거 없는 auto-PASS 불가.</p></div>
<div class="card"><h3>스토리 (ZCL)</h3>
<p class="small"><b>D1</b> 6필수 섹션(+비어있지 않은 developer_context) → <code>E-CTX-LOSS</code></p>
<p class="small" style="margin-top:6px"><b>D2</b> 모든 주장에 <code>[Source:]</code></p>
<p class="small" style="margin-top:6px"><b>D3</b> 상류 sha256 비교 → 바뀌면 <code>E-STALE</code> 재컴파일</p></div>
</div>
<div class="note teal">스토리 엔진(W3)이 심장 — W2 설계를 자족 스토리파일로 응축해 구현자가 스토리만 보고 착수하게 한다.</div>`,
en:`<h2><span class="n">2.5 · 2.6</span>Gate &amp; story engines</h2>
<div class="grid2">
<div class="card"><h3>Gate</h3>
<p class="small"><span class="tag pass">PASS</span> no issues · <span class="tag concern">CONCERNS</span> non-blocking · <span class="tag fail">FAIL</span> <code>critical&gt;0</code></p>
<p class="small muted" style="margin-top:8px">A FACILITATOR, not a generator — <code>facilitator</code> can't be empty. No unsubstantiated auto-PASS.</p></div>
<div class="card"><h3>Story (ZCL)</h3>
<p class="small"><b>D1</b> 6 required sections (+non-empty developer_context) → <code>E-CTX-LOSS</code></p>
<p class="small" style="margin-top:6px"><b>D2</b> <code>[Source:]</code> on every claim</p>
<p class="small" style="margin-top:6px"><b>D3</b> compares upstream sha256 → if changed, <code>E-STALE</code> recompile</p></div>
</div>
<div class="note teal">The story engine (W3) is the heart — condensing W2 design into self-contained story files an implementer can start from alone.</div>`
},
{
ko:`<h2><span class="n">2.7 · 2.8</span>플러그 매니저 &amp; 안전 훅</h2>
<ul>
<li><b>플러그(A9):</b> 도메인 기능은 <code>modules/</code> opt-in 플러그, <b>코어는 모듈을 모른다</b>(의존 그래프로 증명). 트리거 DSL <code>Lv&gt;=N OR domain=X</code></li>
</ul>
<table style="margin-top:10px">
<tr><th>훅</th><th>차단(exit 2)</th></tr>
<tr><td><code>careful-guard</code></td><td>파괴적 명령</td></tr>
<tr><td><code>freeze-guard</code></td><td>소유 경로 밖 편집</td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → W5 차단</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>산출물/스토리 누락</td></tr>
</table>
<div class="note"><b>운영 주의:</b> <code>settings.json</code> <code>hooks</code>에 주석 키 금지 — 서브에이전트 무한 대기.</div>`,
en:`<h2><span class="n">2.7 · 2.8</span>Plug manager &amp; safety hooks</h2>
<ul>
<li><b>Plugs (A9):</b> domain features are opt-in plugs under <code>modules/</code>; <b>the core doesn't know them</b> (proven by the dependency graph). Trigger DSL <code>Lv&gt;=N OR domain=X</code></li>
</ul>
<table style="margin-top:10px">
<tr><th>Hook</th><th>Blocks (exit 2)</th></tr>
<tr><td><code>careful-guard</code></td><td>destructive commands</td></tr>
<tr><td><code>freeze-guard</code></td><td>edits outside owned paths</td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → blocks W5</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>missing artifacts/stories</td></tr>
</table>
<div class="note"><b>Operational note:</b> no comment keys in the <code>settings.json</code> <code>hooks</code> block — subagents hang forever.</div>`
},
{
ko:`<h2><span class="n">2.10</span>오류 분류 (E-codes)</h2>
<p class="lead">엔진은 실패 모드에 이름을 붙여 훅과 사람이 결정적으로 반응하게 한다.</p>
<ul>
<li><code>E-LEVEL-DRIFT</code> 레벨 중도 변경 · <code>E-CONCURRENCY</code> 활성 역할 &gt;3</li>
<li><code>E-CTX-LOSS</code> 불완전 스토리 · <code>E-STALE</code> 상류 대비 구식</li>
<li><code>E-STATE-CORRUPT</code> 스키마 위반 · <code>E-AUDIT-TAMPER</code> 감사 단절</li>
<li><code>E-PLUG-NOTFOUND</code> 없는 모듈</li>
</ul>
<div class="note teal"><b>종료 코드:</b> <code>0</code> 성공 · <code>1</code> 오류 · <code>2</code> 게이트 FAIL(훅 차단). CLI: state·route·wave·gate·story·plug·audit·doctor.</div>`,
en:`<h2><span class="n">2.10</span>Error taxonomy (E-codes)</h2>
<p class="lead">The engine names its failure modes so hooks and humans react deterministically.</p>
<ul>
<li><code>E-LEVEL-DRIFT</code> mid-flight level change · <code>E-CONCURRENCY</code> active roles &gt;3</li>
<li><code>E-CTX-LOSS</code> incomplete story · <code>E-STALE</code> stale vs upstream</li>
<li><code>E-STATE-CORRUPT</code> schema violation · <code>E-AUDIT-TAMPER</code> broken chain</li>
<li><code>E-PLUG-NOTFOUND</code> missing module</li>
</ul>
<div class="note teal"><b>Exit codes:</b> <code>0</code> success · <code>1</code> error · <code>2</code> gate FAIL (hook block). CLI: state·route·wave·gate·story·plug·audit·doctor.</div>`
},
{
ko:`<h2><span class="n">2.13</span>크로스-프로젝트 메모리</h2>
<p class="lead">세션 저장/복원은 프로젝트 <b>내부</b>에 한정. 간직할 지식 — 아키텍처 결정 · 디자인 시스템 · 값비싼 운영 교훈 — 은 프로젝트 <b>사이</b>를 넘어야 한다.</p>
<ul>
<li>전역 레지스트리 <code>~/.bathos/registry/</code> — <code>INDEX.md</code> + 프로젝트 카드 <code>&lt;slug&gt;.md</code></li>
<li><code>/project-handoff</code>가 카드로 증류, <code>/save-session</code>이 <b>자동 upsert</b></li>
<li><code>/recall</code>·<code>/cold-start</code>가 관련 이전 카드를 끌어와 <b>warm-start</b></li>
</ul>
<div class="note">완전히 새 프로젝트도 cold가 아니라 <b>warm</b>으로 — "팀원 hang = quota", 주석키 함정 같은 교훈을 미리 경고받는다. 회상은 제안(User Sovereignty).</div>`,
en:`<h2><span class="n">2.13</span>Cross-project memory</h2>
<p class="lead">Save/restore is limited to <b>within</b> a project. Knowledge worth keeping — architecture decisions · design systems · expensive operational lessons — must cross project <b>boundaries</b>.</p>
<ul>
<li>Global registry <code>~/.bathos/registry/</code> — <code>INDEX.md</code> + project cards <code>&lt;slug&gt;.md</code></li>
<li><code>/project-handoff</code> distills a card; <code>/save-session</code> <b>upserts automatically</b></li>
<li><code>/recall</code>·<code>/cold-start</code> pull relevant earlier cards for a <b>warm start</b></li>
</ul>
<div class="note">A brand-new project starts <b>warm</b>, not cold — pre-warned of lessons like "teammate hang = quota" and the comment-key trap. Recall is a suggestion (User Sovereignty).</div>`
},
{

{
ko:`<h2><span class="n">목차</span>이 강의에서 다루는 것</h2>
<div class="grid2">
<ul><li>두 실행면 — 오케스트레이션 + 엔진</li><li>설치 · 타겟 프로젝트 연동</li><li>빠른 시작 커맨드</li><li>7 웨이브 파이프라인 · W3의 심장</li><li>Scale-Adaptive 라우팅 (Lv0~4)</li></ul>

{
ko:`<h2><span class="n">0</span>두 개의 실행면</h2>
<p class="lead">BATHOS를 제대로 쓰기 위해 먼저 짚을 것은 딱 하나 — 성격이 전혀 다른 두 층에서 동시에 돈다는 점이다.</p>
<table>
<tr><th>층</th><th>정체</th><th>실행 주체</th></tr>
<tr><td><b>오케스트레이션</b></td><td>슬래시 커맨드 · 역할 정의 · 훅 (<code>.claude/</code>)</td><td>리드(Paul) = 메인 세션</td></tr>
<tr><td><b>엔진</b></td><td><code>bathos</code> 단일 정적 Rust 바이너리</td><td>훅/커맨드가 내부 호출</td></tr>
</table>
<div class="note teal">손으로 치는 건 대개 <b>슬래시 커맨드</b>. <code>bathos</code>는 그 밑에서 훅과 커맨드가 알아서 부르는 하부 엔진이다.</div>`,
en:`<h2><span class="n">0</span>Two execution planes</h2>
<p class="lead">There's exactly one thing to grasp first: BATHOS runs on two layers of completely different character at once.</p>
<table>
<tr><th>Layer</th><th>What it is</th><th>Who runs it</th></tr>
<tr><td><b>Orchestration</b></td><td>slash commands · role defs · hooks (<code>.claude/</code>)</td><td>Lead (Paul) = main session</td></tr>
<tr><td><b>Engine</b></td><td>the <code>bathos</code> single static Rust binary</td><td>invoked by hooks/commands</td></tr>
</table>
<div class="note teal">What you type is usually a <b>slash command</b>. <code>bathos</code> is the underlying engine that hooks and commands call for you.</div>`
},
{
ko:`<h2><span class="n">1</span>설치 · 연동</h2>
<ul><li><b>전제:</b> Claude Code <span class="k">v2.1.32+</span> · Agent Teams 실험 기능 · Rust 툴체인(엔진 1회 빌드)</li>
<li>BATHOS는 앱이 아니라 <b>메서드 패키지</b> — ① 엔진 빌드 + ② 자산을 대상 프로젝트에 심는다</li></ul>
<div class="cmd"><span class="c"># B) 엔진 빌드 + 메서드 패키지를 내 프로젝트로 복사</span>
./install.sh <span class="p">--into</span> /abs/path/to/your-project
<span class="c"># 훅이 엔진을 찾도록</span>
export BATHOS_BIN=".../core/target/release/bathos"
export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</div>
<div class="note">아무것도 <b>삭제하지 않는다.</b> 기존 <code>.claude/</code>가 있으면 <code>--force</code> 없이는 덮어쓰지 않는다.</div>`,
en:`<h2><span class="n">1</span>Install · wiring</h2>
<ul><li><b>Prerequisites:</b> Claude Code <span class="k">v2.1.32+</span> · Agent Teams (experimental) · Rust toolchain (build the engine once)</li>
<li>BATHOS is a <b>method package</b>, not an app — ① build the engine + ② plant assets into your project</li></ul>
<div class="cmd"><span class="c"># B) build the engine + copy the package into your project</span>
./install.sh <span class="p">--into</span> /abs/path/to/your-project
<span class="c"># let the hooks find the engine</span>
export BATHOS_BIN=".../core/target/release/bathos"
export CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</div>
<div class="note">It <b>deletes nothing.</b> If a <code>.claude/</code> exists, it won't overwrite without <code>--force</code>.</div>`
},
{
ko:`<h2><span class="n">1.4</span>대상 프로젝트에 생기는 두 디렉터리</h2>
<div class="cmd">your-project/
├── .claude/      <span class="c">← (연동 자산) 커맨드·역할·훅·settings</span>
├── .agent-team/  <span class="c">← (런타임 산출) 기획·설계·리뷰·리포트·상태</span>
│   └── _state/manifest.json  <span class="c">← SSOT (스키마 검증 + 감사 해시체인)</span>
└── src/ ...      <span class="c">← 당신의 실제 제품 소스코드</span></div>
<div class="note teal"><b>둘은 섞이지 않는다.</b> <code>.agent-team/</code>는 BATHOS의 작업 산출물, 실제 코드는 평소처럼 <code>src/</code>에. BATHOS는 그 위에 얹히는 "공정(工程)"이다.</div>`,
en:`<h2><span class="n">1.4</span>The two directories in your project</h2>
<div class="cmd">your-project/
├── .claude/      <span class="c">← (wiring assets) commands·roles·hooks·settings</span>
├── .agent-team/  <span class="c">← (runtime output) planning·design·review·report·state</span>
│   └── _state/manifest.json  <span class="c">← SSOT (schema-validated + audit hash chain)</span>
└── src/ ...      <span class="c">← your actual product source code</span></div>
<div class="note teal"><b>The two never mix.</b> <code>.agent-team/</code> holds BATHOS's work products; real code stays in <code>src/</code>. Think of BATHOS as the "process" laid on top.</div>`
},
{
ko:`<h2><span class="n">2</span>빠른 시작</h2>
<p class="lead">대상 프로젝트 루트에서 Claude Code(= 리드 Paul)를 열고, 슬래시 커맨드로 웨이브를 하나씩 진행한다.</p>
<div class="cmd">/team-kickoff                       <span class="c"># .agent-team 골격 + manifest</span>
/route            /abs/path         <span class="c"># stakes → Lv0~4 추천, 사용자 확정</span>
/wave1-discovery  /abs/path
/wave2-design     /abs/path
/wave3-story-gate /abs/path         <span class="c"># ★ 심장: Readiness Gate</span>
/wave5-implement  /abs/path
/wave6-verify-report /abs/path
/team-confirm                       <span class="c"># 최종 확정</span></div>
<div class="note teal">본류: <b>W0 → W1 → W2 → W3 → W5 → W6</b>. W4(IP·연구)는 W2 이후 언제든 끼우는 선택 플러그.</div>`,
en:`<h2><span class="n">2</span>Quick start</h2>
<p class="lead">Open Claude Code (= lead Paul) at your project root, then advance the waves one at a time via slash commands.</p>
<div class="cmd">/team-kickoff                       <span class="c"># .agent-team skeleton + manifest</span>
/route            /abs/path         <span class="c"># stakes → Lv0–4 rec, user confirms</span>
/wave1-discovery  /abs/path
/wave2-design     /abs/path
/wave3-story-gate /abs/path         <span class="c"># ★ the heart: Readiness Gate</span>
/wave5-implement  /abs/path
/wave6-verify-report /abs/path
/team-confirm                       <span class="c"># final confirmation</span></div>
<div class="note teal">Mainline: <b>W0 → W1 → W2 → W3 → W5 → W6</b>. W4 (IP·Research) is an optional plug, insertable any time after W2.</div>`
},
{
ko:`<h2><span class="n">3</span>7 웨이브 파이프라인</h2>
<table>
<tr><th>웨이브</th><th>팀원</th><th>게이트</th></tr>
<tr><td><b>W0</b> 분석 <span class="muted small">(선택)</span></td><td>Caleb</td><td>Brief Readiness</td></tr>
<tr><td><b>W1</b> 디스커버리·시장</td><td>John ∥ Caleb</td><td>USP Readiness</td></tr>
<tr><td><b>W2</b> 기획·아키·디자인</td><td>Joshua → (James, Jonnathan)</td><td>Plan Readiness</td></tr>
<tr><td><b>W3</b> 스토리·게이트 ★</td><td>Matthew + Thomas·Matthias</td><td class="tag concern">Implementation (이중)</td></tr>
<tr><td><b>W5</b> 구현</td><td>Phillip, Andrew, Stephen</td><td>스토리 단위</td></tr>
<tr><td><b>W6</b> 검증·문서·리포트</td><td>(Thomas,Timothy,Matthias)→Michael→Hananiah→Martin</td><td>Release Readiness</td></tr>
</table>
<div class="note">인수인계는 오직 <b>디스크 파일</b>(<code>.agent-team/…</code>)로 — 대화 히스토리에 기대지 않는다. 동시 활성 팀원 ≤ 3.</div>`,
en:`<h2><span class="n">3</span>The 7-wave pipeline</h2>
<table>
<tr><th>Wave</th><th>Teammates</th><th>Gate</th></tr>
<tr><td><b>W0</b> Analysis <span class="muted small">(opt)</span></td><td>Caleb</td><td>Brief Readiness</td></tr>
<tr><td><b>W1</b> Discovery·Market</td><td>John ∥ Caleb</td><td>USP Readiness</td></tr>
<tr><td><b>W2</b> Plan·Arch·Design</td><td>Joshua → (James, Jonnathan)</td><td>Plan Readiness</td></tr>
<tr><td><b>W3</b> Story·Gate ★</td><td>Matthew + Thomas·Matthias</td><td class="tag concern">Implementation (dual)</td></tr>
<tr><td><b>W5</b> Implementation</td><td>Phillip, Andrew, Stephen</td><td>per-story</td></tr>
<tr><td><b>W6</b> Verify·Docs·Report</td><td>(Thomas,Timothy,Matthias)→Michael→Hananiah→Martin</td><td>Release Readiness</td></tr>
</table>
<div class="note">Handoffs happen only via <b>disk files</b> (<code>.agent-team/…</code>), never conversation history. Concurrent active teammates ≤ 3.</div>`
},
{
ko:`<h2><span class="n">3 ★</span>W3가 심장인 이유</h2>
<p class="lead">설계(W2)와 구현(W5) 사이에는 늘 <b>컨텍스트가 새어 나가는 틈</b>이 있다 — 만드는 쪽이 설계의 절반을 잊거나 보지 못한다. 대부분의 "AI가 앱 만들어줘"가 무너지는 지점이다.</p>
<ul>
<li>#17 <b>Matthew</b>가 W2 설계를 <b>자족 dev 스토리파일</b>로 응축 (9섹션)</li>
<li>모든 기술 세부에 <code>[Source: …]</code> 근거 표기 → 아키/디자인 문서로 추적</li>
<li><b>Thomas · Matthias</b>가 독립 리뷰 → 게이트 <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note"><b>FAIL이면</b> <code>gate-enforce</code> 훅이 W5 진입을 <b>물리적으로 차단</b>(exit 2). 실패한 게이트 위에서는 구현을 시작할 수 없다.</div>`,
en:`<h2><span class="n">3 ★</span>Why W3 is the heart</h2>
<p class="lead">Between design (W2) and build (W5) there's always a <b>crack where context leaks out</b> — the builder forgets or never saw half the design. It's where most "AI, build my app" attempts collapse.</p>
<ul>
<li>#17 <b>Matthew</b> condenses W2 design into <b>self-contained dev story files</b> (9 sections)</li>
<li>Every technical detail carries <code>[Source: …]</code> evidence → traceable to arch/design docs</li>
<li><b>Thomas · Matthias</b> review independently → gate returns <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note">On <b>FAIL</b>, the <code>gate-enforce</code> hook <b>physically blocks</b> entry to W5 (exit 2). You literally can't start building on a failed gate.</div>`
},
{
ko:`<h2><span class="n">4</span>Scale-Adaptive 라우팅</h2>
<p class="lead">작업 규모에 맞춰 가동할 웨이브·역할을 <b>명시적으로</b> 조절한다. 항상 풀가동하지 않는다.</p>
<table>
<tr><th>Lv</th><th>작업 유형</th><th>가동 웨이브</th></tr>
<tr><td><b>0</b></td><td>버그·사소 변경</td><td>W5 (+초경량 W6)</td></tr>
<tr><td><b>1</b></td><td>소기능·리팩터</td><td>경량 W2 + W3축약 + W5 + W6</td></tr>
<tr><td><b>2</b></td><td>표준 기능/모듈</td><td>W1+W2+W3+W5+W6</td></tr>
<tr><td><b>3</b></td><td>신규 제품·대형</td><td>W0~W6 (W4 선택)</td></tr>
<tr><td><b>4</b></td><td>엔터프라이즈·규제</td><td>W0~W6 전체 + W4 풀</td></tr>
</table>
<div class="note teal"><code>/route</code>는 stakes로 레벨을 <b>추천</b>만 한다. <b>확정은 사용자의 몫</b>(User Sovereignty). 현재 레벨은 <code>manifest.json</code>의 <code>current_level</code>.</div>`,
en:`<h2><span class="n">4</span>Scale-Adaptive routing</h2>
<p class="lead">It <b>explicitly</b> adjusts which waves and roles run to fit the work size — never full throttle by default.</p>
<table>
<tr><th>Lv</th><th>Work type</th><th>Waves run</th></tr>
<tr><td><b>0</b></td><td>Bug · trivial</td><td>W5 (+ultra-light W6)</td></tr>
<tr><td><b>1</b></td><td>Small feature · refactor</td><td>light W2 + W3-abridged + W5 + W6</td></tr>
<tr><td><b>2</b></td><td>Standard feature/module</td><td>W1+W2+W3+W5+W6</td></tr>
<tr><td><b>3</b></td><td>New product · large</td><td>W0–W6 (W4 optional)</td></tr>
<tr><td><b>4</b></td><td>Enterprise · regulated</td><td>full W0–W6 + full W4</td></tr>
</table>
<div class="note teal"><code>/route</code> only <b>recommends</b> a level from stakes. <b>The decision is the user's</b> (User Sovereignty). Current level lives in <code>current_level</code> of <code>manifest.json</code>.</div>`
},
{
ko:`<h2><span class="n">5</span>게이트 시스템</h2>
<table>
<tr><th>판정</th><th>의미</th><th>동작</th></tr>
<tr><td><span class="tag pass">PASS</span></td><td>기준 충족, 블로커 없음</td><td>다음 웨이브 즉시 진입</td></tr>
<tr><td><span class="tag concern">CONCERNS</span></td><td>비차단 리스크</td><td><code>_state/</code>에 로그 후 진행</td></tr>
<tr><td><span class="tag fail">FAIL</span></td><td>차단 결함 (critical &gt; 0)</td><td>진입 차단 → 보완 후 재게이트</td></tr>
</table>
<div class="note teal">게이트는 <b>판정을 돕는 FACILITATOR이지, 만들어 내는 generator가 아니다</b> — 근거 없는 자동 PASS 금지. 판정 주체(<code>facilitator</code>)는 결코 비어 있을 수 없다(불변식).</div>`,
en:`<h2><span class="n">5</span>The gate system</h2>
<table>
<tr><th>Verdict</th><th>Meaning</th><th>Action</th></tr>
<tr><td><span class="tag pass">PASS</span></td><td>Criteria met, no blockers</td><td>enter next wave immediately</td></tr>
<tr><td><span class="tag concern">CONCERNS</span></td><td>non-blocking risks</td><td>log to <code>_state/</code> and proceed</td></tr>
<tr><td><span class="tag fail">FAIL</span></td><td>blocking defects (critical &gt; 0)</td><td>blocked → fix, then re-gate</td></tr>
</table>
<div class="note teal">The gate is a <b>FACILITATOR that assists a verdict, not a generator that fabricates one</b> — no unsubstantiated auto-PASS. The deciding <code>facilitator</code> can never be empty (an invariant).</div>`
},
{
ko:`<h2><span class="n">6</span>CLI 엔진 <code>bathos</code></h2>
<p class="lead">직접 부를 일은 드물다 — 훅과 커맨드가 대신 부른다. 그래도 표면 전체를 알아 두면 좋다.</p>
<div class="grid2">
<ul><li><code>state</code> — SSOT 검증·조회</li><li><code>route</code> — 레벨 추천/확정</li><li><code>wave</code> — 7웨이브 전이 (≤3)</li><li><code>gate</code> — 판정 기록/조회</li></ul>
<ul><li><code>story</code> — 완전성·출처·신선도</li><li><code>plug</code> — 모듈 토글</li><li><code>audit</code> — 감사체인 append/verify</li><li><code>doctor</code> — 설치·배선 진단</li></ul>
</div>
<div class="note"><b>종료 코드:</b> <code>0</code> 성공 · <code>1</code> 오류 · <code>2</code> 게이트 FAIL(훅이 차단에 사용).</div>`,
en:`<h2><span class="n">6</span>CLI engine <code>bathos</code></h2>
<p class="lead">You'll rarely call it by hand — hooks and commands do. Still, worth knowing the whole surface.</p>
<div class="grid2">
<ul><li><code>state</code> — validate/show SSOT</li><li><code>route</code> — recommend/confirm level</li><li><code>wave</code> — 7-wave transitions (≤3)</li><li><code>gate</code> — record/show verdicts</li></ul>
<ul><li><code>story</code> — completeness·source·freshness</li><li><code>plug</code> — toggle modules</li><li><code>audit</code> — audit chain append/verify</li><li><code>doctor</code> — install/wiring preflight</li></ul>
</div>
<div class="note"><b>Exit codes:</b> <code>0</code> success · <code>1</code> error · <code>2</code> gate FAIL (used by hooks to block).</div>`
},
{
ko:`<h2><span class="n">7</span>훅 / 안전계층</h2>
<p class="lead">6종 결정적·fail-safe 훅이 Claude Code 이벤트에 바인딩된다. 엔진의 보장이 실제 세션에서 효력을 갖는 지점.</p>
<table>
<tr><th>훅</th><th>차단(exit 2) 조건</th></tr>
<tr><td><code>careful-guard</code></td><td><code>rm -rf</code>·<code>DROP TABLE</code>·<code>git push --force</code></td></tr>
<tr><td><code>freeze-guard</code></td><td><code>BATHOS_OWNED_PATHS</code> 밖 편집</td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → W5 진입 물리 차단</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>QA/W3 산출물 누락</td></tr>
</table>
<div class="note"><b>운영 주의:</b> <code>settings.json</code>의 <code>hooks</code> 블록엔 <b>유효한 이벤트명만</b> — 주석 키(<code>_note</code> 등)를 섞으면 서브에이전트 시작이 무한 대기.</div>`,
en:`<h2><span class="n">7</span>Hooks / safety layer</h2>
<p class="lead">Six deterministic, fail-safe hooks bind to Claude Code events — where the engine's guarantees take effect in a live session.</p>
<table>
<tr><th>Hook</th><th>Blocks (exit 2) when</th></tr>
<tr><td><code>careful-guard</code></td><td><code>rm -rf</code>·<code>DROP TABLE</code>·<code>git push --force</code></td></tr>
<tr><td><code>freeze-guard</code></td><td>edit outside <code>BATHOS_OWNED_PATHS</code></td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → physically blocks W5</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>missing QA/W3 artifacts</td></tr>
</table>
<div class="note"><b>Operational note:</b> the <code>hooks</code> block in <code>settings.json</code> must hold <b>valid event names only</b> — a comment key (<code>_note</code>, etc.) sends subagents into an infinite wait.</div>`
},
{
ko:`<h2><span class="n">8</span>17 역할 (3계층 오버라이드)</h2>
<div class="grid2">
<div class="card"><h3>Opus 4.8 — 설계 밀도</h3><p class="small muted">Paul(리드) · John · Caleb · Joshua · James · Mark · Jonnathan · <b>Matthew(#17)</b></p></div>
<div class="card"><h3>Sonnet 5 — 구현·검증</h3><p class="small muted">Nathanael · Phillip · Andrew · Stephen · Timothy · Thomas · Michael · Hananiah · Matthias · Martin</p></div>
</div>
<ul style="margin-top:16px">
<li><b>Paul</b>은 팀원으로 스폰되지 않는 <b>메인 세션</b></li>
<li><b>Matthew(#17)</b>는 <b>W3 활성 시에만</b> 스폰 → 평소 토큰 0</li>
<li>오버라이드 3계층: <span class="k">base</span>(고정 정체성) → <span class="k">team</span>(경로·스택) → <span class="k">user</span>(언어·상세도)</li>
</ul>`,
en:`<h2><span class="n">8</span>The 17 roles (3-layer override)</h2>
<div class="grid2">
<div class="card"><h3>Opus 4.8 — design density</h3><p class="small muted">Paul(lead) · John · Caleb · Joshua · James · Mark · Jonnathan · <b>Matthew(#17)</b></p></div>

ko:`<h2><span class="n">9</span>플러그 모듈 (W4)</h2>
<p class="lead">코어는 슬림하게 두고 도메인 기능은 플러그로 켜고 끈다. <b>코어는 모듈을 모른다</b> — 역의존 금지(불변식 A9).</p>
<div class="cmd">module_id: ip
wave: W4
trigger: <span class="p">"Lv&gt;=3 OR domain=ip"</span>   <span class="c"># 자동 트리거 조건</span>
enabled_default: false
outputs: ".agent-team/05-ip/"</div>
<ul style="margin-top:14px"><li>기본 동봉: <b>ip-pack</b>(특허 출원명세) · <b>research-pack</b>(학술 Abstract/Intro)</li>
<li>트리거 DSL: <code>Lv&gt;=N</code> · <code>domain=X</code> 를 <code>OR</code>로 결합, 해석 불가 토큰은 보수적 <code>false</code></li></ul>`,
en:`<h2><span class="n">9</span>Plug modules (W4)</h2>
<p class="lead">The core stays slim; domain features toggle on/off as plugs. <b>The core doesn't know they exist</b> — reverse deps forbidden (invariant A9).</p>
<div class="cmd">module_id: ip
wave: W4
trigger: <span class="p">"Lv&gt;=3 OR domain=ip"</span>   <span class="c"># auto-trigger condition</span>
enabled_default: false
outputs: ".agent-team/05-ip/"</div>
<ul style="margin-top:14px"><li>Bundled: <b>ip-pack</b> (patent spec) · <b>research-pack</b> (academic Abstract/Intro)</li>
<li>Trigger DSL: <code>Lv&gt;=N</code> · <code>domain=X</code> joined by <code>OR</code>; unparseable tokens are conservatively <code>false</code></li></ul>`
},
{
ko:`<h2><span class="n">11</span>상태 모델 — 단일 진실 원천</h2>
<p class="lead">전 프로젝트 상태가 단 하나의 JSON <code>_state/manifest.json</code>에 인라인되고 JSON Schema로 검증된다.</p>
<ul>
<li>1:N 배열: <code>routing</code> · <code>waves</code> · <code>roles</code> · <code>tasks</code> · <code>gates</code> · <code>risks</code> · <code>modules</code> · <code>artifacts</code></li>
<li><b>원자적 쓰기</b> — manifest는 절반만 쓰인 채 남지 않는다</li>
<li><b>tamper-evident 감사 해시체인</b> — 모든 변경이 append-only sha256 체인에 기록, 단일 writer가 직렬화</li>
</ul>
<div class="note teal">체인 단절은 <code>E-AUDIT-TAMPER</code>, 스키마 위반은 <code>E-STATE-CORRUPT</code>로 검출.</div>`,
en:`<h2><span class="n">11</span>State model — single source of truth</h2>
<p class="lead">All project state is inlined in one JSON, <code>_state/manifest.json</code>, validated by JSON Schema.</p>
<ul>
<li>1:N arrays: <code>routing</code> · <code>waves</code> · <code>roles</code> · <code>tasks</code> · <code>gates</code> · <code>risks</code> · <code>modules</code> · <code>artifacts</code></li>
<li><b>Atomic writes</b> — the manifest is never left half-written</li>
<li><b>Tamper-evident audit hash chain</b> — every change appended to an append-only sha256 chain, serialized by a single writer</li>
</ul>
<div class="note teal">A broken chain surfaces as <code>E-AUDIT-TAMPER</code>; a schema violation as <code>E-STATE-CORRUPT</code>.</div>`
},
{
ko:`<h2><span class="n">12</span>세션 저장 / 복원</h2>
<p class="lead">실제 빌드는 여러 세션에 걸치고, 팀원은 리드의 대화 히스토리를 <b>물려받지 않는다</b>. 그래서 모든 것을 디스크에 영속시킨다.</p>
<ul>
<li><code>/save-session</code> — 세션 전체를 <code>SESSION-SNAPSHOT.md</code> + SSOT 덤프로 저장 <span class="muted small">(별칭 /save)</span></li>
<li><code>/cold-start</code> — 문맥 0인 새 세션에서 완전 복원·브리핑 <span class="muted small">(별칭 /resume)</span></li>
<li>자연어도 동작: "저장/체크포인트" · "이어서/재개"</li>
<li><b>크로스-프로젝트 메모리</b> — <code>~/.bathos/registry/</code>로 다른 프로젝트도 warm-start</li>
</ul>
<div class="note">팀원이 조용해지면 대개 크래시가 아니라 <b>quota 한도</b> — 저장 → 리셋 대기 → 복원 → 웨이브 재실행. 무손실.</div>`,
en:`<h2><span class="n">12</span>Session save / restore</h2>
<p class="lead">Real builds span many sessions, and teammates <b>don't inherit</b> the lead's conversation history. So everything is persisted to disk.</p>
<ul>
<li><code>/save-session</code> — save the whole session to <code>SESSION-SNAPSHOT.md</code> + an SSOT dump <span class="muted small">(alias /save)</span></li>
<li><code>/cold-start</code> — fully restore &amp; brief in a zero-context session <span class="muted small">(alias /resume)</span></li>
<li>Natural language works: "save/checkpoint" · "continue/resume"</li>
<li><b>Cross-project memory</b> — <code>~/.bathos/registry/</code> warm-starts even new projects</li>
</ul>
<div class="note">A quiet teammate is usually not a crash but a <b>quota limit</b> — save → wait for reset → restore → re-run the wave. Lossless.</div>`
},
{
ko:`<h2><span class="n">13</span>트러블슈팅 — 현장 교훈</h2>
<table>
<tr><th>증상</th><th>원인 · 해결</th></tr>
<tr><td>서브에이전트 무한 대기</td><td><code>hooks</code>에 주석 키 → 유효 이벤트명만, <code>bathos doctor</code></td></tr>
<tr><td>팀원이 출력 없이 멈춤</td><td>계정 <b>사용량 한도</b>(버그 아님) → 리셋 후 재스폰</td></tr>
<tr><td><code>state validate</code> 거부</td><td>운영용 스키마 ↔ product 스키마 혼동</td></tr>
<tr><td>다중 프로젝트 역할 충돌</td><td>agent type/name 충돌 → 프로젝트별 고유 접미사</td></tr>
</table>
<div class="note teal">가장 값진 교훈 한 줄: <b>"멈춘 듯한 팀원"의 1순위 원인은 버그가 아니라 quota다.</b></div>`,
en:`<h2><span class="n">13</span>Troubleshooting — field lessons</h2>
<table>
<tr><th>Symptom</th><th>Cause · fix</th></tr>
<tr><td>Subagent hangs at startup</td><td>comment key in <code>hooks</code> → valid event names only, <code>bathos doctor</code></td></tr>
<tr><td>Teammate stuck, no output</td><td>account <b>usage limit</b> (not a bug) → wait, respawn</td></tr>
<tr><td><code>state validate</code> rejects</td><td>ops schema ↔ product schema confusion</td></tr>
<tr><td>Role collisions, multi-project</td><td>agent type/name clash → per-project unique suffix</td></tr>
</table>
<div class="note teal">The one lesson worth most: <b>a "stuck" teammate is, first and foremost, quota — not a bug.</b></div>`
},

ko:`<h2><span class="n">14</span>현재 상태 & 정직한 한계</h2>

en:`<h2><span class="n">14</span>Status &amp; honest limits</h2>
<p class="lead"><b>v0.1.0 — early, but it builds and runs end-to-end today.</b></p>
<ul>
<li>Not a standalone app but a <b>method package on Claude Code v2.1.32+</b>, dependent on Agent Teams</li>
<li>Engine verified: <b>257 Rust + 46 hook tests, all green</b>, clippy clean, reproducible release</li>
<li><b>Fully independent certification (dogfooding):</b> applied W6 to its own code → ThomasCert·MatthiasCert both PASS. Functional QA was green, yet independent review caught a <b>blocking defect the author had missed</b></li>
<li>Not production-hardened yet — APIs/schemas may change before 1.0</li>
</ul>
<div class="note">Proof of the thesis: <b>generation ≠ verification.</b> When one model writes and self-approves, blind spots always remain.</div>`

const SERIES = ['usecase','features','usage'];
let ser = 'usecase', idx = 0, lang = 'ko';
let S = DECKS[ser];

const deck = document.getElementById('deck');
const dotsWrap = document.getElementById('dots');
let slides = [], dots = [];

function mount(){
  deck.innerHTML=''; dotsWrap.innerHTML='';
  S.forEach((_,i)=>{
    const s=document.createElement('section'); s.className='slide'; deck.appendChild(s);
    const d=document.createElement('button'); d.className='dot'; d.onclick=()=>go(i);
    d.setAttribute('aria-label','slide '+(i+1)); dotsWrap.appendChild(d);
  });
  slides=[...deck.querySelectorAll('.slide')];
  dots=[...dotsWrap.querySelectorAll('.dot')];
  document.getElementById('tot').textContent=S.length;
  render();
}
function render(){ slides.forEach((s,i)=>{ s.innerHTML=S[i][lang]; }); }
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('bar').style.width=(S.length>1?(idx/(S.length-1)*100):0)+'%';
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===S.length-1;
  const act=slides[idx]; if(act) act.scrollTop=0;
}
function go(n){ idx=Math.max(0,Math.min(S.length-1,n)); paint(); }
function setSeries(k){
  if(k===ser) return;
  ser=k; S=DECKS[ser]; idx=0;
  document.querySelectorAll('#seriesnav button').forEach(b=>b.classList.toggle('cur',b.dataset.s===ser));
  mount(); paint();
}
function setLang(l){
  lang=l;
  document.getElementById('ko').classList.toggle('on',l==='ko');
  document.getElementById('en').classList.toggle('on',l==='en');
  document.body.classList.toggle('en', l==='en');
  render(); paint();
}
document.querySelectorAll('#seriesnav button').forEach(b=>b.addEventListener('click',()=>setSeries(b.dataset.s)));
document.querySelector('#seriesnav button[data-s="usecase"]').classList.add('cur');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(S.length-1);}
  else if(e.key.toLowerCase()==='k'){setLang('ko');} else if(e.key.toLowerCase()==='e'){setLang('en');}
  else if(e.key>='1'&&e.key<='3'){setSeries(SERIES[+e.key-1]);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(idx+(dx<0?1:-1));},{passive:true});
mount(); paint();
</script>
