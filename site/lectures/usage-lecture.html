<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATHOS 사용 가이드 — 강의안</title>
<style>
  :root{
    --abyss:#081215; --abyss-2:#0b1a1e; --surface:#0f2226; --surface-2:#12292e;
    --line:#1c3a40; --teal:#18b6c0; --teal-brand:#0e9aa1; --teal-soft:#7fd6dc;
    --ink:#e9f3f4; --muted:#8fabb0; --dim:#5f7c81;
    --amber:#e0ad55; --rose:#e5738a; --grn:#4fbf9a;
    --mono:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1100px 620px at 78% -8%, rgba(14,154,161,.20), transparent 60%),
      radial-gradient(900px 560px at 8% 108%, rgba(14,154,161,.12), transparent 60%),
      var(--abyss);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* top bar */
  header{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:linear-gradient(180deg, rgba(8,18,21,.92), rgba(8,18,21,.55) 70%, transparent);
    backdrop-filter:blur(4px);
  }
  .wordmark{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:.06em}
  .wordmark b{color:var(--teal);text-shadow:0 0 18px rgba(24,182,192,.5)}
  .wordmark .gr{font-family:var(--mono);color:var(--dim);font-weight:600;font-size:.78rem;letter-spacing:.02em}
  .spacer{flex:1}
  .counter{font-family:var(--mono);color:var(--muted);font-size:.82rem;letter-spacing:.05em}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(15,34,38,.6)}
  .toggle button{
    all:unset;cursor:pointer;padding:6px 13px;font-size:.78rem;font-weight:700;color:var(--muted);
    letter-spacing:.04em;transition:.15s;
  }
  .toggle button.on{background:var(--teal-brand);color:#04181a;text-shadow:none}
  .toggle button:not(.on):hover{color:var(--teal-soft)}
  .series{display:flex;gap:6px;align-items:center}
  .series a{font-family:var(--mono);font-size:.74rem;letter-spacing:.03em;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;transition:.15s;white-space:nowrap}
  .series a:hover{color:var(--teal-soft);border-color:var(--teal)}
  .series a.cur{background:var(--surface-2);color:var(--teal-soft);border-color:var(--teal)}
  .series .en{display:none}
  body.en .series .en{display:inline} body.en .series .kr{display:none}
  @media (max-width:820px){ .series{display:none} }
  /* stage */
  .stage{position:fixed;inset:56px 0 64px;display:flex;align-items:center;justify-content:center;padding:22px}
  .deck{width:min(1000px,100%);height:100%;position:relative}
  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:20px 8px;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .34s ease, transform .34s ease;overflow-y:auto;
  }
  .slide.active{opacity:1;transform:none;pointer-events:auto}
  .kicker{font-family:var(--mono);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
  h1{font-size:clamp(2.1rem,5.4vw,3.7rem);line-height:1.06;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
  h1 .gr{display:block;font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--teal-soft);letter-spacing:.04em;margin-top:14px}
  h2{font-size:clamp(1.5rem,3.4vw,2.35rem);line-height:1.14;margin:0 0 20px;font-weight:800;letter-spacing:-.01em}
  h2 .n{color:var(--teal);font-family:var(--mono);font-weight:700;margin-right:.5em}
  .lead{font-size:clamp(1.02rem,1.7vw,1.22rem);color:var(--muted);line-height:1.6;max-width:60ch}
  .sub{font-size:clamp(1rem,1.9vw,1.28rem);color:var(--muted);max-width:62ch;line-height:1.55}
  ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:11px}
  li{position:relative;padding-left:26px;font-size:clamp(.98rem,1.5vw,1.12rem);line-height:1.5;color:var(--ink)}
  li::before{content:"▸";position:absolute;left:2px;top:0;color:var(--teal);font-size:.95em}
  li b{color:#fff}
  li .k{color:var(--teal-soft);font-weight:700}
  code,.cmd,.mono{font-family:var(--mono)}
  code{background:rgba(24,182,192,.12);color:var(--teal-soft);padding:.08em .42em;border-radius:5px;font-size:.9em}
  .cmd{
    display:block;background:#061012;border:1px solid var(--line);border-left:3px solid var(--teal-brand);
    border-radius:9px;padding:15px 17px;margin-top:10px;color:#cfe9ec;font-size:clamp(.8rem,1.25vw,.98rem);
    line-height:1.75;white-space:pre;overflow-x:auto;
  }
  .cmd .c{color:var(--dim)}
  .cmd .p{color:var(--teal)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:clamp(.85rem,1.3vw,1.02rem)}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--teal);font-family:var(--mono);font-weight:700;font-size:.82em;letter-spacing:.05em;text-transform:uppercase}
  td b{color:#fff}
  .tag{font-family:var(--mono);font-size:.86em;padding:.1em .5em;border-radius:5px;border:1px solid var(--line)}
  .pass{color:var(--grn);border-color:rgba(79,191,154,.4)}
  .concern{color:var(--amber);border-color:rgba(224,173,85,.4)}
  .fail{color:var(--rose);border-color:rgba(229,115,138,.4)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{margin:0 0 10px;font-size:1.02rem;color:var(--teal-soft);font-family:var(--mono);letter-spacing:.03em}
  .note{
    margin-top:16px;padding:13px 16px;border-radius:10px;background:rgba(224,173,85,.09);
    border:1px solid rgba(224,173,85,.32);color:#f0dcb4;font-size:.96rem;line-height:1.55;
  }
  .note.teal{background:rgba(24,182,192,.09);border-color:rgba(24,182,192,.32);color:var(--teal-soft)}
  .note b{color:#fff}
  .pill{display:inline-block;font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;color:var(--teal);
    border:1px solid var(--line);border-radius:999px;padding:3px 11px;margin:0 6px 8px 0}
  .hint{margin-top:26px;font-family:var(--mono);color:var(--dim);font-size:.82rem;letter-spacing:.05em}
  .muted{color:var(--muted)} .small{font-size:.9rem}
  /* footer / nav */
  footer{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 22px;
    background:linear-gradient(0deg, rgba(8,18,21,.94), rgba(8,18,21,.4) 70%, transparent)}
  .progress{position:absolute;top:0;left:0;height:2px;background:var(--teal);box-shadow:0 0 10px var(--teal);transition:width .34s ease}
  .dots{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:#1e3d43;border:none;cursor:pointer;padding:0;transition:.2s}
  .dot:hover{background:var(--teal-soft)}
  .dot.on{background:var(--teal);box-shadow:0 0 8px var(--teal);transform:scale(1.15)}
  .nav{display:flex;gap:8px}
  .nav button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:9px;
    border:1px solid var(--line);background:rgba(15,34,38,.6);color:var(--teal-soft);font-size:1.1rem;transition:.15s}
  .nav button:hover{border-color:var(--teal);background:rgba(24,182,192,.14)}
  .nav button:disabled{opacity:.3;cursor:default}
  @media (max-width:640px){
    .grid2{grid-template-columns:1fr} .stage{inset:52px 0 60px;padding:14px}
    header{height:52px;padding:0 14px} footer{padding:0 14px} .dots{display:none}
    .wordmark .gr{display:none}
  }
  @media print{
    body{overflow:visible;background:#fff;color:#111}
    header,footer{display:none} .stage{position:static;inset:auto;display:block}
    .deck{width:100%;height:auto} .slide{position:static;opacity:1;transform:none;page-break-after:always;
      min-height:90vh;border-bottom:1px solid #ccc}
  }
</style>
</head>

<tr><td><b>W6</b> 검증·문서·리포트</td><td>(Thomas,Timothy,Matthias)→Hananiah→Martin</td><td>Release Readiness</td></tr>

<div class="note">인수인계는 오직 <b>디스크 파일</b>(<code>.agent-team/…</code>)로 — 대화 히스토리에 기대지 않는다. 동시 활성 팀원 ≤ 3.</div>`,
en:`<h2><span class="n">3</span>The 7-wave pipeline</h2>
<table>
<tr><th>Wave</th><th>Teammates</th><th>Gate</th></tr>
<tr><td><b>W0</b> Analysis <span class="muted small">(opt)</span></td><td>Caleb</td><td>Brief Readiness</td></tr>
<tr><td><b>W1</b> Discovery·Market</td><td>John ∥ Caleb</td><td>USP Readiness</td></tr>
<tr><td><b>W2</b> Plan·Arch·Design</td><td>Joshua → (James, Jonnathan)</td><td>Plan Readiness</td></tr>
<tr><td><b>W3</b> Story·Gate ★</td><td>Matthew + Thomas·Matthias</td><td class="tag concern">Implementation (dual)</td></tr>
<tr><td><b>W5</b> Implementation</td><td>Phillip, Andrew, Stephen</td><td>per-story</td></tr>
<tr><td><b>W6</b> Verify·Docs·Report</td><td>(Thomas,Timothy,Matthias)→Hananiah→Martin</td><td>Release Readiness</td></tr>
</table>
<div class="note">Handoffs happen only via <b>disk files</b> (<code>.agent-team/…</code>), never conversation history. Concurrent active teammates ≤ 3.</div>`
},
{
ko:`<h2><span class="n">3 ★</span>W3가 심장인 이유</h2>
<p class="lead">설계(W2)와 구현(W5) 사이에는 늘 <b>컨텍스트가 새어 나가는 틈</b>이 있다 — 만드는 쪽이 설계의 절반을 잊거나 보지 못한다. 대부분의 "AI가 앱 만들어줘"가 무너지는 지점이다.</p>
<ul>
<li>#17 <b>Matthew</b>가 W2 설계를 <b>자족 dev 스토리파일</b>로 응축 (9섹션)</li>
<li>모든 기술 세부에 <code>[Source: …]</code> 근거 표기 → 아키/디자인 문서로 추적</li>
<li><b>Thomas · Matthias</b>가 독립 리뷰 → 게이트 <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note"><b>FAIL이면</b> <code>gate-enforce</code> 훅이 W5 진입을 <b>물리적으로 차단</b>(exit 2). 실패한 게이트 위에서는 구현을 시작할 수 없다.</div>`,
en:`<h2><span class="n">3 ★</span>Why W3 is the heart</h2>
<p class="lead">Between design (W2) and build (W5) there's always a <b>crack where context leaks out</b> — the builder forgets or never saw half the design. It's where most "AI, build my app" attempts collapse.</p>
<ul>
<li>#17 <b>Matthew</b> condenses W2 design into <b>self-contained dev story files</b> (9 sections)</li>
<li>Every technical detail carries <code>[Source: …]</code> evidence → traceable to arch/design docs</li>
<li><b>Thomas · Matthias</b> review independently → gate returns <span class="tag pass">PASS</span> <span class="tag concern">CONCERNS</span> <span class="tag fail">FAIL</span></li>
</ul>
<div class="note">On <b>FAIL</b>, the <code>gate-enforce</code> hook <b>physically blocks</b> entry to W5 (exit 2). You literally can't start building on a failed gate.</div>`
},
{
ko:`<h2><span class="n">4</span>Scale-Adaptive 라우팅</h2>
<p class="lead">작업 규모에 맞춰 가동할 웨이브·역할을 <b>명시적으로</b> 조절한다. 항상 풀가동하지 않는다.</p>
<table>
<tr><th>Lv</th><th>작업 유형</th><th>가동 웨이브</th></tr>
<tr><td><b>0</b></td><td>버그·사소 변경</td><td>W5 (+초경량 W6)</td></tr>
<tr><td><b>1</b></td><td>소기능·리팩터</td><td>경량 W2 + W3축약 + W5 + W6</td></tr>
<tr><td><b>2</b></td><td>표준 기능/모듈</td><td>W1+W2+W3+W5+W6</td></tr>
<tr><td><b>3</b></td><td>신규 제품·대형</td><td>W0~W6 (W4 선택)</td></tr>
<tr><td><b>4</b></td><td>엔터프라이즈·규제</td><td>W0~W6 전체 + W4 풀</td></tr>
</table>
<div class="note teal"><code>/route</code>는 stakes로 레벨을 <b>추천</b>만 한다. <b>확정은 사용자의 몫</b>(User Sovereignty). 현재 레벨은 <code>manifest.json</code>의 <code>current_level</code>.</div>`,
en:`<h2><span class="n">4</span>Scale-Adaptive routing</h2>
<p class="lead">It <b>explicitly</b> adjusts which waves and roles run to fit the work size — never full throttle by default.</p>
<table>
<tr><th>Lv</th><th>Work type</th><th>Waves run</th></tr>
<tr><td><b>0</b></td><td>Bug · trivial</td><td>W5 (+ultra-light W6)</td></tr>
<tr><td><b>1</b></td><td>Small feature · refactor</td><td>light W2 + W3-abridged + W5 + W6</td></tr>
<tr><td><b>2</b></td><td>Standard feature/module</td><td>W1+W2+W3+W5+W6</td></tr>
<tr><td><b>3</b></td><td>New product · large</td><td>W0–W6 (W4 optional)</td></tr>
<tr><td><b>4</b></td><td>Enterprise · regulated</td><td>full W0–W6 + full W4</td></tr>
</table>
<div class="note teal"><code>/route</code> only <b>recommends</b> a level from stakes. <b>The decision is the user's</b> (User Sovereignty). Current level lives in <code>current_level</code> of <code>manifest.json</code>.</div>`
},
{
ko:`<h2><span class="n">5</span>게이트 시스템</h2>
<table>
<tr><th>판정</th><th>의미</th><th>동작</th></tr>
<tr><td><span class="tag pass">PASS</span></td><td>기준 충족, 블로커 없음</td><td>다음 웨이브 즉시 진입</td></tr>
<tr><td><span class="tag concern">CONCERNS</span></td><td>비차단 리스크</td><td><code>_state/</code>에 로그 후 진행</td></tr>
<tr><td><span class="tag fail">FAIL</span></td><td>차단 결함 (critical &gt; 0)</td><td>진입 차단 → 보완 후 재게이트</td></tr>
</table>
<div class="note teal">게이트는 <b>판정을 돕는 FACILITATOR이지, 만들어 내는 generator가 아니다</b> — 근거 없는 자동 PASS 금지. 판정 주체(<code>facilitator</code>)는 결코 비어 있을 수 없다(불변식).</div>`,
en:`<h2><span class="n">5</span>The gate system</h2>
<table>
<tr><th>Verdict</th><th>Meaning</th><th>Action</th></tr>
<tr><td><span class="tag pass">PASS</span></td><td>Criteria met, no blockers</td><td>enter next wave immediately</td></tr>
<tr><td><span class="tag concern">CONCERNS</span></td><td>non-blocking risks</td><td>log to <code>_state/</code> and proceed</td></tr>
<tr><td><span class="tag fail">FAIL</span></td><td>blocking defects (critical &gt; 0)</td><td>blocked → fix, then re-gate</td></tr>
</table>
<div class="note teal">The gate is a <b>FACILITATOR that assists a verdict, not a generator that fabricates one</b> — no unsubstantiated auto-PASS. The deciding <code>facilitator</code> can never be empty (an invariant).</div>`
},
{
ko:`<h2><span class="n">6</span>CLI 엔진 <code>bathos</code></h2>
<p class="lead">직접 부를 일은 드물다 — 훅과 커맨드가 대신 부른다. 그래도 표면 전체를 알아 두면 좋다.</p>
<div class="grid2">
<ul><li><code>state</code> — SSOT 검증·조회</li><li><code>route</code> — 레벨 추천/확정</li><li><code>wave</code> — 7웨이브 전이 (≤3)</li><li><code>gate</code> — 판정 기록/조회</li></ul>
<ul><li><code>story</code> — 완전성·출처·신선도</li><li><code>plug</code> — 모듈 토글</li><li><code>audit</code> — 감사체인 append/verify</li><li><code>doctor</code> — 설치·배선 진단</li></ul>
</div>
<div class="note"><b>종료 코드:</b> <code>0</code> 성공 · <code>1</code> 오류 · <code>2</code> 게이트 FAIL(훅이 차단에 사용).</div>`,
en:`<h2><span class="n">6</span>CLI engine <code>bathos</code></h2>
<p class="lead">You'll rarely call it by hand — hooks and commands do. Still, worth knowing the whole surface.</p>
<div class="grid2">
<ul><li><code>state</code> — validate/show SSOT</li><li><code>route</code> — recommend/confirm level</li><li><code>wave</code> — 7-wave transitions (≤3)</li><li><code>gate</code> — record/show verdicts</li></ul>
<ul><li><code>story</code> — completeness·source·freshness</li><li><code>plug</code> — toggle modules</li><li><code>audit</code> — audit chain append/verify</li><li><code>doctor</code> — install/wiring preflight</li></ul>
</div>
<div class="note"><b>Exit codes:</b> <code>0</code> success · <code>1</code> error · <code>2</code> gate FAIL (used by hooks to block).</div>`
},
{
ko:`<h2><span class="n">7</span>훅 / 안전계층</h2>
<p class="lead">6종 결정적·fail-safe 훅이 Claude Code 이벤트에 바인딩된다. 엔진의 보장이 실제 세션에서 효력을 갖는 지점.</p>
<table>
<tr><th>훅</th><th>차단(exit 2) 조건</th></tr>
<tr><td><code>careful-guard</code></td><td><code>rm -rf</code>·<code>DROP TABLE</code>·<code>git push --force</code></td></tr>
<tr><td><code>freeze-guard</code></td><td><code>BATHOS_OWNED_PATHS</code> 밖 편집</td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → W5 진입 물리 차단</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>QA/W3 산출물 누락</td></tr>
</table>
<div class="note"><b>운영 주의:</b> <code>settings.json</code>의 <code>hooks</code> 블록엔 <b>유효한 이벤트명만</b> — 주석 키(<code>_note</code> 등)를 섞으면 서브에이전트 시작이 무한 대기.</div>`,
en:`<h2><span class="n">7</span>Hooks / safety layer</h2>
<p class="lead">Six deterministic, fail-safe hooks bind to Claude Code events — where the engine's guarantees take effect in a live session.</p>
<table>
<tr><th>Hook</th><th>Blocks (exit 2) when</th></tr>
<tr><td><code>careful-guard</code></td><td><code>rm -rf</code>·<code>DROP TABLE</code>·<code>git push --force</code></td></tr>
<tr><td><code>freeze-guard</code></td><td>edit outside <code>BATHOS_OWNED_PATHS</code></td></tr>
<tr><td><code>gate-enforce</code></td><td><b>W3 FAIL → physically blocks W5</b></td></tr>
<tr><td><code>artifact-verify</code></td><td>missing QA/W3 artifacts</td></tr>
</table>
<div class="note"><b>Operational note:</b> the <code>hooks</code> block in <code>settings.json</code> must hold <b>valid event names only</b> — a comment key (<code>_note</code>, etc.) sends subagents into an infinite wait.</div>`
},
{
ko:`<h2><span class="n">8</span>17 역할 (3계층 오버라이드)</h2>
<div class="grid2">
<div class="card"><h3>Opus 4.8 — 설계 밀도</h3><p class="small muted">Paul(리드) · John · Caleb · Joshua · James · Mark · Jonnathan · <b>Matthew(#17)</b></p></div>
<div class="card"><h3>Sonnet 5 — 구현·검증</h3><p class="small muted">Nathanael · Phillip · Andrew · Stephen · Timothy · Thomas · Hananiah · Matthias · Martin</p></div>
</div>
<ul style="margin-top:16px">
<li><b>Paul</b>은 팀원으로 스폰되지 않는 <b>메인 세션</b></li>
<li><b>Matthew(#17)</b>는 <b>W3 활성 시에만</b> 스폰 → 평소 토큰 0</li>
<li>오버라이드 3계층: <span class="k">base</span>(고정 정체성) → <span class="k">team</span>(경로·스택) → <span class="k">user</span>(언어·상세도)</li>
</ul>`,
en:`<h2><span class="n">8</span>The 17 roles (3-layer override)</h2>
<div class="grid2">
<div class="card"><h3>Opus 4.8 — design density</h3><p class="small muted">Paul(lead) · John · Caleb · Joshua · James · Mark · Jonnathan · <b>Matthew(#17)</b></p></div>
<div class="card"><h3>Sonnet 5 — build·verify</h3><p class="small muted">Nathanael · Phillip · Andrew · Stephen · Timothy · Thomas · Hananiah · Matthias · Martin</p></div>
</div>
<ul style="margin-top:16px">
<li><b>Paul</b> is the <b>main session</b>, never spawned as a teammate</li>
<li><b>Matthew(#17)</b> spawns <b>only while W3 is active</b> → zero tokens otherwise</li>
<li>3-layer override: <span class="k">base</span> (fixed identity) → <span class="k">team</span> (paths·stack) → <span class="k">user</span> (language·verbosity)</li>
</ul>`
},
{
ko:`<h2><span class="n">9</span>플러그 모듈 (W4)</h2>
<p class="lead">코어는 슬림하게 두고 도메인 기능은 플러그로 켜고 끈다. <b>코어는 모듈을 모른다</b> — 역의존 금지(불변식 A9).</p>
<div class="cmd">module_id: ip
wave: W4
trigger: <span class="p">"Lv&gt;=3 OR domain=ip"</span>   <span class="c"># 자동 트리거 조건</span>
enabled_default: false
outputs: ".agent-team/05-ip/"</div>
<ul style="margin-top:14px"><li>기본 동봉: <b>ip-pack</b>(특허 출원명세) · <b>research-pack</b>(학술 Abstract/Intro)</li>
<li>트리거 DSL: <code>Lv&gt;=N</code> · <code>domain=X</code> 를 <code>OR</code>로 결합, 해석 불가 토큰은 보수적 <code>false</code></li></ul>`,
en:`<h2><span class="n">9</span>Plug modules (W4)</h2>
<p class="lead">The core stays slim; domain features toggle on/off as plugs. <b>The core doesn't know they exist</b> — reverse deps forbidden (invariant A9).</p>
<div class="cmd">module_id: ip
wave: W4
trigger: <span class="p">"Lv&gt;=3 OR domain=ip"</span>   <span class="c"># auto-trigger condition</span>
enabled_default: false
outputs: ".agent-team/05-ip/"</div>
<ul style="margin-top:14px"><li>Bundled: <b>ip-pack</b> (patent spec) · <b>research-pack</b> (academic Abstract/Intro)</li>
<li>Trigger DSL: <code>Lv&gt;=N</code> · <code>domain=X</code> joined by <code>OR</code>; unparseable tokens are conservatively <code>false</code></li></ul>`
},
{
ko:`<h2><span class="n">11</span>상태 모델 — 단일 진실 원천</h2>
<p class="lead">전 프로젝트 상태가 단 하나의 JSON <code>_state/manifest.json</code>에 인라인되고 JSON Schema로 검증된다.</p>
<ul>
<li>1:N 배열: <code>routing</code> · <code>waves</code> · <code>roles</code> · <code>tasks</code> · <code>gates</code> · <code>risks</code> · <code>modules</code> · <code>artifacts</code></li>
<li><b>원자적 쓰기</b> — manifest는 절반만 쓰인 채 남지 않는다</li>
<li><b>tamper-evident 감사 해시체인</b> — 모든 변경이 append-only sha256 체인에 기록, 단일 writer가 직렬화</li>
</ul>
<div class="note teal">체인 단절은 <code>E-AUDIT-TAMPER</code>, 스키마 위반은 <code>E-STATE-CORRUPT</code>로 검출.</div>`,
en:`<h2><span class="n">11</span>State model — single source of truth</h2>
<p class="lead">All project state is inlined in one JSON, <code>_state/manifest.json</code>, validated by JSON Schema.</p>
<ul>
<li>1:N arrays: <code>routing</code> · <code>waves</code> · <code>roles</code> · <code>tasks</code> · <code>gates</code> · <code>risks</code> · <code>modules</code> · <code>artifacts</code></li>
<li><b>Atomic writes</b> — the manifest is never left half-written</li>
<li><b>Tamper-evident audit hash chain</b> — every change appended to an append-only sha256 chain, serialized by a single writer</li>
</ul>
<div class="note teal">A broken chain surfaces as <code>E-AUDIT-TAMPER</code>; a schema violation as <code>E-STATE-CORRUPT</code>.</div>`
},
{
ko:`<h2><span class="n">12</span>세션 저장 / 복원</h2>
<p class="lead">실제 빌드는 여러 세션에 걸치고, 팀원은 리드의 대화 히스토리를 <b>물려받지 않는다</b>. 그래서 모든 것을 디스크에 영속시킨다.</p>
<ul>
<li><code>/save-session</code> — 세션 전체를 <code>SESSION-SNAPSHOT.md</code> + SSOT 덤프로 저장 <span class="muted small">(별칭 /save)</span></li>
<li><code>/cold-start</code> — 문맥 0인 새 세션에서 완전 복원·브리핑 <span class="muted small">(별칭 /resume)</span></li>
<li>자연어도 동작: "저장/체크포인트" · "이어서/재개"</li>
<li><b>크로스-프로젝트 메모리</b> — <code>~/.bathos/registry/</code>로 다른 프로젝트도 warm-start</li>
</ul>
<div class="note">팀원이 조용해지면 대개 크래시가 아니라 <b>quota 한도</b> — 저장 → 리셋 대기 → 복원 → 웨이브 재실행. 무손실.</div>`,
en:`<h2><span class="n">12</span>Session save / restore</h2>
<p class="lead">Real builds span many sessions, and teammates <b>don't inherit</b> the lead's conversation history. So everything is persisted to disk.</p>
<ul>
<li><code>/save-session</code> — save the whole session to <code>SESSION-SNAPSHOT.md</code> + an SSOT dump <span class="muted small">(alias /save)</span></li>
<li><code>/cold-start</code> — fully restore &amp; brief in a zero-context session <span class="muted small">(alias /resume)</span></li>
<li>Natural language works: "save/checkpoint" · "continue/resume"</li>
<li><b>Cross-project memory</b> — <code>~/.bathos/registry/</code> warm-starts even new projects</li>
</ul>
<div class="note">A quiet teammate is usually not a crash but a <b>quota limit</b> — save → wait for reset → restore → re-run the wave. Lossless.</div>`
},
{
ko:`<h2><span class="n">13</span>트러블슈팅 — 현장 교훈</h2>
<table>
<tr><th>증상</th><th>원인 · 해결</th></tr>
<tr><td>서브에이전트 무한 대기</td><td><code>hooks</code>에 주석 키 → 유효 이벤트명만, <code>bathos doctor</code></td></tr>
<tr><td>팀원이 출력 없이 멈춤</td><td>계정 <b>사용량 한도</b>(버그 아님) → 리셋 후 재스폰</td></tr>
<tr><td><code>state validate</code> 거부</td><td>운영용 스키마 ↔ product 스키마 혼동</td></tr>
<tr><td>다중 프로젝트 역할 충돌</td><td>agent type/name 충돌 → 프로젝트별 고유 접미사</td></tr>
</table>
<div class="note teal">가장 값진 교훈 한 줄: <b>"멈춘 듯한 팀원"의 1순위 원인은 버그가 아니라 quota다.</b></div>`,
en:`<h2><span class="n">13</span>Troubleshooting — field lessons</h2>
<table>
<tr><th>Symptom</th><th>Cause · fix</th></tr>
<tr><td>Subagent hangs at startup</td><td>comment key in <code>hooks</code> → valid event names only, <code>bathos doctor</code></td></tr>
<tr><td>Teammate stuck, no output</td><td>account <b>usage limit</b> (not a bug) → wait, respawn</td></tr>

/* ---- runtime ---- */
let idx = 0, lang = 'ko';
const deck = document.getElementById('deck');
const dotsWrap = document.getElementById('dots');
S.forEach((_,i)=>{
  const s=document.createElement('section'); s.className='slide'; s.dataset.i=i; deck.appendChild(s);
  const d=document.createElement('button'); d.className='dot'; d.onclick=()=>go(i);
  d.setAttribute('aria-label','slide '+(i+1)); dotsWrap.appendChild(d);
});
const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
document.getElementById('tot').textContent=S.length;

function render(){ slides.forEach((s,i)=>{ s.innerHTML=S[i][lang]; }); }
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('bar').style.width=((idx)/(S.length-1)*100)+'%';
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===S.length-1;
  const act=slides[idx]; if(act) act.scrollTop=0;
}
function go(n){ idx=Math.max(0,Math.min(S.length-1,n)); paint(); }
function setLang(l){
  lang=l;
  document.getElementById('ko').classList.toggle('on',l==='ko');
  document.getElementById('en').classList.toggle('on',l==='en');
  document.documentElement.lang = (l==='ko'?'ko':'en');
  document.body.classList.toggle('en', l==='en');
  render(); paint();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(S.length-1);}
  else if(e.key.toLowerCase()==='k'){setLang('ko');} else if(e.key.toLowerCase()==='e'){setLang('en');}
});
/* swipe (touch) */
let tx=0;
document.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(idx+(dx<0?1:-1));},{passive:true});

render(); paint();
</script>
